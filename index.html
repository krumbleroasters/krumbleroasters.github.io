/* ---------- 이미지 전처리 (log.html 검증본 + 대비 보정) ---------- */
function psResize(img, maxSide, quality, enhance) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const scale = Math.min(1, maxSide / Math.max(w0, h0));
  const cw = Math.max(1, Math.round(w0 * scale)), ch = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  const ctx = c.getContext("2d", enhance ? { willReadFrequently: true } : undefined);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, cw, ch);
  if (enhance) {
    const d = ctx.getImageData(0, 0, cw, ch), a = d.data, total = cw * ch;
    const hist = new Uint32Array(256);
    for (let i = 0; i < a.length; i += 4) hist[(a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114) | 0]++;
    let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.04) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= total * 0.04) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    const lut = new Uint8Array(256);
    for (let v = 0; v < 256; v++) {
      let n = (v - lo) / span;
      n = n < 0 ? 0 : n > 1 ? 1 : n;
      lut[v] = Math.round(Math.pow(n, 0.92) * 255);
    }
    for (let i = 0; i < a.length; i += 4) {
      const o = lut[(a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114) | 0];
      a[i] = o; a[i + 1] = o; a[i + 2] = o;
    }
    ctx.putImageData(d, 0, 0);
  }
  return c.toDataURL("image/jpeg", quality);
}

function psLoadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image load")); };
    img.src = url;
  });
}

/* ---------- OCR ---------- */
function psLogger(job) {
  return (m) => {
    if (job !== PV.job || !PV.active) return;
    const p = typeof m.progress === "number" ? m.progress : 0;
    let label = "사진 속 글자를 읽는 중";
    if (m.status === "loading tesseract core") label = "인식 엔진을 불러오는 중";
    else if (m.status === "initializing tesseract") label = "인식 엔진을 준비하는 중";
    else if (m.status === "loading language traineddata") label = "한국어·영어 글자 데이터 준비 중";
    else if (m.status === "initializing api") label = "인식 준비 중";
    const isRec = m.status === "recognizing text";
    const base = isRec ? PV.recBase : 0.06;
    const spanW = isRec ? PV.recSpan : 0.36;
    psSetStatus("run", label, base + p * spanW, m.status === "loading language traineddata" ? PS_DATA_NOTE : "");
  };
}
function psSpawnWorker(job, langPath) {
  return window.Tesseract.createWorker("kor+eng", 1, {
    workerPath: TESS.worker,
    corePath: TESS.core,
    langPath,
    logger: psLogger(job)
  });
}
function psEnsureWorker(job) {
  if (PV.worker) return Promise.resolve(PV.worker);
  psSetStatus("run", "인식 엔진을 내려받는 중", 0.06, PS_DATA_NOTE);
  return psLoadScript(TESS.js)
    .then(() => {
      if (!window.Tesseract) throw new Error("no tesseract");
      return psSpawnWorker(job, TESS.lang).catch((err) => {
        console.warn("ocr worker: first lang host failed", err);
        if (job !== PV.job || !PV.active) throw err;
        psSetStatus("run", "글자 데이터를 다른 곳에서 받는 중", 0.12, PS_DATA_NOTE);
        return psSpawnWorker(job, TESS.langAlt);
      });
    })
    .then((w) => { PV.worker = w; return w; });
}

async function psRecognize(dataUrl, job) {
  const w = await psEnsureWorker(job);
  if (job !== PV.job || !PV.active) return "";
  const res = await w.recognize(dataUrl);
  if (job !== PV.job || !PV.active) return "";
  return psClean(res && res.data && res.data.text ? res.data.text : "");
}

function psClean(text) {
  return String(text || "").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}

/* ---------- 카탈로그 매칭 (log.html 로직 그대로) ---------- */
let PSIDX = null;
function psNormKo(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^0-9a-z\uac00-\ud7a3]/g, ""); }
function psNormEn(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^0-9a-z]/g, ""); }
function psBigrams(s) { const out = []; for (let i = 0; i < s.length - 1; i++) out.push(s.slice(i, i + 2)); return out; }
function psDedupe(arr) { return Array.from(new Set(arr)); }
function psCover(grams, set) {
  if (!grams.length) return 0;
  let hit = 0;
  for (const g of grams) if (set.has(g)) hit++;
  return hit / grams.length;
}
function psBuildIndex() {
  if (PSIDX) return PSIDX;
  const places = (CAT.places || []).map((p) => {
    const o = Object.assign({}, p);
    o._n = psNormKo(p.name); o._nEn = psNormEn(p.nameEn); o._nCountry = psNormKo(p.country);
    o._g = psDedupe(psBigrams(o._n)); o._gEn = psDedupe(psBigrams(o._nEn));
    return o;
  });
  const beans = (CAT.beans || []).map((b) => {
    const o = Object.assign({}, b);
    o._n = psNormKo(b.name); o._nRegion = psNormKo(b.region); o._nEn = psNormEn(b.name);
    o._g = psDedupe(psBigrams(o._n)); o._gEn = psDedupe(psBigrams(o._nEn));
    return o;
  });
  PSIDX = { places, beans, placeMap: new Map(places.map((p) => [p.id, p])), beanMap: new Map(beans.map((b) => [b.id, b])) };
  return PSIDX;
}
function psMakeText(raw) {
  const nk = psNormKo(raw), ne = psNormEn(raw);
  const tokens = String(raw || "").split(/[\s\n\r,.;:·|/()\[\]"'“”‘’!?\-—]+/).filter((t) => t.length >= 2);
  return {
    raw, nk, ne,
    gramsKo: new Set(psBigrams(nk)),
    gramsEn: new Set(psBigrams(ne)),
    tokens: tokens.map((t) => ({ raw: t, nk: psNormKo(t), ne: psNormEn(t) }))
  };
}
function psScorePlace(p, t) {
  let s = 0, why = [];
  if (p._n && p._n.length >= 2) {
    if (t.nk.indexOf(p._n) !== -1) { s += 14 + Math.min(12, (p._n.length - 2) * 1.1); why.push(p.name); }
    else if (p._n.length >= 3) {
      const c = psCover(p._g, t.gramsKo);
      if (c >= 0.6) { s += 14 * c; why.push(p.name); }
    }
  }
  if (p._nEn && p._nEn.length >= 4) {
    if (t.ne.indexOf(p._nEn) !== -1) { s += 13 + Math.min(10, (p._nEn.length - 4) * 0.7); why.push(p.nameEn); }
    else if (p._nEn.length >= 6) {
      const ce = psCover(p._gEn, t.gramsEn);
      if (ce >= 0.72) { s += 11 * ce; why.push(p.nameEn); }
    }
  }
  if (p.kind !== "country" && p._nCountry && t.nk.indexOf(p._nCountry) !== -1) s += 2.5;
  if (p.kind === "farm") s *= 1.12;
  else if (p.kind === "country") s *= 0.8;
  p._why = why;
  return s;
}
function psScoreBean(b, t, placeScore) {
  let s = placeScore * 0.55;
  if (b._n && t.nk.indexOf(b._n) !== -1) s += 24;
  else {
    const c = psCover(b._g, t.gramsKo);
    if (c > 0.2) s += c * 46;
  }
  if (b._nEn && b._nEn.length >= 8) {
    if (t.ne.indexOf(b._nEn) !== -1) s += 18;
    else {
      const ce = psCover(b._gEn, t.gramsEn);
      if (ce > 0.22) s += ce * 34;
    }
  }
  if (b._nRegion && t.nk.indexOf(b._nRegion) !== -1) s += 4;
  return s;
}
function psChips(name, place, t) {
  const pool = [name, place ? place.name : "", place ? place.nameEn : "", place ? place.country : ""];
  const poolN = pool.map(psNormKo);
  const seen = {}, out = [];
  t.tokens.forEach((tok) => {
    if (tok.nk.length < 2 || seen[tok.nk]) return;
    for (let i = 0; i < poolN.length; i++) {
      if (poolN[i] && poolN[i].indexOf(tok.nk) !== -1) { seen[tok.nk] = 1; out.push(tok.raw); return; }
    }
  });
  return out.slice(0, 5);
}
function psFindMatches(raw, limit) {
  limit = limit || 6;
  if (!CAT.beans || !CAT.beans.length) return [];
  const IDX = psBuildIndex();
  const t = psMakeText(raw);
  if (!t.nk && !t.ne) return [];
  const placeScores = new Map();
  IDX.places.forEach((p) => {
    const sc = psScorePlace(p, t);
    if (sc > 5) placeScores.set(p.id, sc);
  });
  const beanHits = [];
  for (const b of IDX.beans) {
    const sc = psScoreBean(b, t, placeScores.get(b.placeId) || 0);
    if (sc > 9) beanHits.push({ b, s: sc });
  }
  beanHits.sort((x, y) => y.s - x.s);
  const beanItems = beanHits.slice(0, limit).map((h) => {
    const pl = IDX.placeMap.get(h.b.placeId);
    return {
      kind: "bean", bean: h.b, place: pl || null, score: h.s, name: h.b.name,
      sub: [h.b.country, h.b.region, h.b.farm].filter(Boolean).join(" · "),
      chips: psChips(h.b.name, pl, t)
    };
  });
  const placeItems = IDX.places.filter((p) => placeScores.has(p.id))
    .sort((a, b) => placeScores.get(b.id) - placeScores.get(a.id))
    .slice(0, 4)
    .map((p) => ({
      kind: "place", place: p, score: placeScores.get(p.id), name: p.name,
      sub: [p.country, p.kind === "farm" ? "농장" : p.kind === "region" ? "산지" : "국가"].join(" · "),
      chips: psChips(p.name, p, t)
    }));
  const merged = [];
  const beanQuota = Math.max(2, limit - 2);
  beanItems.slice(0, beanQuota).forEach((x) => merged.push(x));
  placeItems.forEach((x) => {
    if (merged.length >= limit) return;
    if (merged.some((m) => psNormKo(m.name) === psNormKo(x.name))) return;
    merged.push(x);
  });
  merged.sort((a, b) => b.score - a.score);
  return merged.slice(0, limit);
}

/* ---------- 패널 그리기 ---------- */
function psCandHTML(c, idx) {
  const isBean = c.kind === "bean";
  const kind = isBean ? "bean" : (c.place.kind || "region");
  const bdgTxt = isBean ? "생두" : (c.place.kind === "farm" ? "농장" : c.place.kind === "region" ? "산지" : "국가");
  const chips = (c.chips && c.chips.length) ? " · " + c.chips.map(esc).join(", ") : "";
  return '<button class="pscand" type="button" data-pscand="' + idx + '">' +
    '<span class="bdg ' + esc(kind) + '">' + esc(bdgTxt) + "</span>" +
    '<span class="tx"><span class="nm">' + esc(c.name) + "</span>" +
    '<span class="mt">' + esc(c.sub) + (chips ? "<b>" + chips + "</b>" : "") + "</span></span>" +
    '<span class="arw" aria-hidden="true">›</span></button>';
}

function psRender() {
  const host = document.getElementById("psPanel");
  if (!host) return;
  const cls = PV.mode === "ok" ? "ok" : PV.mode === "fail" ? "fail" : "";
  const pctTxt = typeof PV.pct === "number" && PV.pct > 0 ? Math.round(PV.pct * 100) + "%" : "";
  const pctW = typeof PV.pct === "number" ? Math.round(PV.pct * 100) : 0;
  let html = '<div class="psphead"><h2>사진으로 찾기</h2>' +
    '<button class="psx" type="button" data-psclose aria-label="사진 검색 닫기">✕</button></div>' +
    '<div class="psrow">' +
    (PV.thumb ? '<img src="' + PV.thumb + '" alt="고른 사진 미리보기" />' : "") +
    '<div class="psstate ' + cls + '" id="psState" aria-live="polite">' +
    '<div class="lbl"><span class="spin" id="psSpin"' + (PV.mode === "run" ? "" : ' style="display:none"') + "></span>" +
    '<span id="psLabel">' + esc(PV.label) + '</span><span class="pct" id="psPct">' + pctTxt + "</span></div>" +
    '<div class="psbar"><i id="psFill" style="width:' + pctW + '%"></i></div>' +
    '<p class="psnote" id="psNote"' + (PV.note ? "" : " hidden") + ">" + esc(PV.note) + "</p>" +
    "</div></div>";
  if (PV.text) {
    html += '<div class="pstext"><label class="lbl" for="psText">사진에서 읽은 글자</label>' +
      '<textarea id="psText" aria-label="사진에서 읽은 글자">' + esc(PV.text) + "</textarea>" +
      '<div class="psacts"><button class="psbtn" type="button" id="psRematch">이 글자로 다시 찾기</button></div></div>';
  }
  if (PV.cands.length) html += '<div class="pscands">' + PV.cands.map(psCandHTML).join("") + "</div>";
  if (PV.candNote) html += '<p class="psnote">' + esc(PV.candNote) + "</p>";
  html += '<div class="psacts"><button class="psbtn ghost" type="button" id="psAgain">다른 사진으로 찾기</button>' +
    '<button class="psbtn ghost" type="button" id="psManual">검색창에서 직접 찾기</button></div>';
  host.innerHTML = html;

  /* 읽은 글자가 한눈에 보이도록 글자 높이만큼 늘리고, 넘치면 190px까지만 */
  const ta0 = host.querySelector("#psText");
  if (ta0) {
    const fit = () => { ta0.style.height = "auto"; ta0.style.height = Math.min(190, Math.max(86, ta0.scrollHeight + 4)) + "px"; };
    fit();
    ta0.addEventListener("input", fit);
  }

  const x = host.querySelector("[data-psclose]");
  if (x) x.addEventListener("click", () => psClose());
  const again = host.querySelector("#psAgain");
  if (again) again.addEventListener("click", () => psOpenModal());
  const manual = host.querySelector("#psManual");
  if (manual) manual.addEventListener("click", () => { psClose(); qEl.focus(); });
  host.querySelectorAll("[data-pscand]").forEach((el) => {
    el.addEventListener("click", () => psChoose(Number(el.dataset.pscand)));
  });
  const rm = host.querySelector("#psRematch");
  if (rm) rm.addEventListener("click", () => {
    const ta = host.querySelector("#psText");
    const v = (ta && ta.value ? ta.value : "").trim();
    if (!v) { if (ta) ta.focus(); return; }
    PV.text = v;
    const items = psFindMatches(v, 6);
    PV.cands = items;
    if (items.length) { PV.candNote = ""; psSetStatus("ok", "후보 " + items.length + "개", 1, ""); }
    else { PV.candNote = "이 글자로는 딱 맞는 후보를 찾지 못했어요. 단어를 줄이거나 이름을 고쳐 다시 찾아보세요."; psSetStatus("fail", "후보를 찾지 못했어요", 0, ""); }
    psRender();
  });
}

function psMount() {
  let host = document.getElementById("psPanel");
  if (!host) {
    host = document.createElement("section");
    host.id = "psPanel";
    host.className = "pspanel";
    host.setAttribute("role", "region");
    host.setAttribute("aria-label", "사진으로 찾기");
    sheetEl.prepend(host);
    psRender();
  } else if (sheetEl.firstElementChild !== host) {
    sheetEl.prepend(host);
  }
  if (getComputedStyle(sheetEl).overflowY === "visible") {
    const r = sheetEl.getBoundingClientRect();
    if (r.top < -4) window.scrollTo({ top: Math.max(0, window.scrollY + r.top - 6), behavior: "auto" });
  } else {
    sheetEl.scrollTop = 0;
  }
}

function psClose() {
  PV.job++;
  PV.active = false;
  PS_ON = false;
  const host = document.getElementById("psPanel");
  if (host) host.remove();
}

function psChoose(i) {
  const c = PV.cands[i];
  if (!c) return;
  if (c.kind === "bean") {
    const b = CAT.beans.find((x) => x.id === c.bean.id);
    if (!b) return;
    psClose();
    qEl.value = beanName(b);
    selectBean(b);
  } else {
    const p = placeById.get(c.place.id);
    if (!p) return;
    psClose();
    qEl.value = p.name;
    selectPlace(p);
  }
}

/* ---------- 사진을 골랐을 때 ---------- */
async function psHandleFile(file) {
  if (!file) return;
  PS_ON = true;
  PV.active = true;
  PV.text = ""; PV.cands = []; PV.candNote = ""; PV.thumb = "";
  const job = ++PV.job;
  if (!/^image\//.test(file.type || "")) {
    PV.mode = "fail"; PV.label = "이미지 파일만 고를 수 있어요"; PV.pct = 0;
    PV.note = "사진(JPG·PNG 등)을 골라 주세요.";
    psMount(); psRender();
    return;
  }
  psSetStatus("run", "사진을 불러오는 중", 0.03, "");
  psMount(); psRender();
  try {
    const img = await psLoadImage(file);
    if (job !== PV.job) return;
    PV.thumb = psResize(img, 220, 0.7, false);
    PV.recBase = 0.42; PV.recSpan = 0.5;
    psSetStatus("run", "인식 엔진을 준비하는 중", 0.06, PS_DATA_NOTE);
    psRender();
    let text = await psRecognize(psResize(img, 1000, 0.76, false), job);
    if (job !== PV.job) return;
    let items = text ? psFindMatches(text, 6) : [];
    if (!items.length) {
      PV.recBase = 0.72; PV.recSpan = 0.26;
      psSetStatus("run", text ? "글자를 더 또렷하게 해 다시 읽는 중" : "글자를 한 번 더 읽는 중", 0.7, "");
      const t2 = await psRecognize(psResize(img, 1100, 0.8, true), job);
      if (job !== PV.job) return;
      if (t2 && t2.length > (text || "").length) text = t2;
      items = text ? psFindMatches(text, 6) : [];
    }
    PV.text = text || "";
    PV.cands = items;
    if (items.length) {
      PV.candNote = "";
      psSetStatus("ok", "글자를 읽었어요 · 후보 " + items.length + "개", 1, "");
    } else if (text) {
      PV.candNote = "사진 글자로는 딱 맞는 커피를 찾지 못했어요. 위 글자를 고쳐 다시 찾거나 검색창에서 직접 찾아보세요.";
      psSetStatus("ok", "글자는 읽었지만 후보를 찾지 못했어요", 1, "");
    } else {
      PV.candNote = "사진에서 글자를 찾지 못했어요. 라벨이 크게 보이게 다시 찍거나 검색창에서 직접 찾아보세요.";
      psSetStatus("fail", "글자를 찾지 못했어요", 0, "");
    }
    psRender();
  } catch (err) {
    if (job !== PV.job) return;
    console.warn("photo ocr failed", err);
    PV.worker = null;
    PV.candNote = "인식 엔진을 불러오지 못했어요(네트워크 확인). 검색창에서 직접 찾을 수 있어요.";
    psSetStatus("fail", "자동 인식이 안 됐어요", 0, "");
    psRender();
  }
}

(function psWire() {
  const camBtn = $("#camBtn"), back = $("#psBack");
  const inpCam = $("#psInpCam"), inpLib = $("#psInpLib");
  if (!camBtn || !back || !inpCam || !inpLib) return;
  camBtn.addEventListener("click", () => psOpenModal());
  $("#psOptCam").addEventListener("click", () => { psCloseModal(); inpCam.click(); });
  $("#psOptLib").addEventListener("click", () => { psCloseModal(); inpLib.click(); });
  $("#psCloseBtn").addEventListener("click", () => psCloseModal());
  back.addEventListener("click", (e) => { if (e.target === back) psCloseModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !back.hidden) psCloseModal(); });
  inpCam.addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) psHandleFile(f); });
  inpLib.addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) psHandleFile(f); });
})();

boot();
