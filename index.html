<title>온커피로그 ONCOFFEELOG · 커피 산지·농장 지도</title>
<meta name="description" content="온커피로그(ONCOFFEELOG) 커피 산지·농장 지도 — 국내에 들어온 생두 2,800여 종이 어디서 자랐는지 지도에서 보여줍니다. 크럼블로스터스(KRUMBLE ROASTERS)가 운영합니다." />

<meta property="og:title" content="온커피로그 ONCOFFEELOG · 커피 산지·농장 지도" />
<meta property="og:description" content="국내와 일본에 유통되는 생두 3,113종이 어디서 자랐는지 지도에서 보여줍니다." />
<meta property="og:url" content="https://oncoffeelog.com/" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --cream:#FBF7F0;
    --cream-2:#F3ECE1;
    --ink:#221E1A;
    --ink-soft:#5A5148;
    --line:#E2D8C9;
    --terra:#C2603C;
    --terra-soft:#E8B9A6;
    --green:#2F4636;
    --green-soft:#7E9478;
    --navlog:#2F5D4A;      /* 내 커피 기록 버튼 — 차분한 세이지·포레스트 그린 */
    --navlog-deep:#254B3B;
    --navcomp:#9A5B13;     /* 커피대회 버튼 — 트로피·로스팅 느낌의 앰버·브론즈 */
    --navcomp-deep:#7C480E;
    --shadow:0 10px 30px -18px rgba(34,30,26,.45);
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  html.pm-lock,html.pm-lock body{overflow:hidden}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font-family:inherit}

  .app{display:flex;flex-direction:column;height:100dvh}

  /* ---------- header ---------- */
  .head{padding:18px 18px 12px;flex:none;background:var(--cream);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:9px}
  .bean{width:22px;height:22px;flex:none}
  .brand-txt{font-size:11.5px;letter-spacing:.22em;font-weight:700;color:var(--ink)}
  .brand-txt span{color:var(--terra)}
  .lede{margin:10px 0 0;font-size:22px;line-height:1.28;font-weight:700;letter-spacing:-.02em}
  .lede em{font-style:normal;color:var(--terra)}
  .lede small{display:block;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--ink-soft);letter-spacing:0}

  /* ---------- search ---------- */
  .search{position:relative;margin:14px 0 0}
  .search-box{
    display:flex;align-items:center;gap:9px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:0 6px 0 14px;height:48px;box-shadow:var(--shadow);
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .search-box:focus-within{border-color:var(--terra);box-shadow:0 0 0 4px rgba(194,96,60,.10)}
  .search-box svg{flex:none;color:var(--ink-soft)}
  #q{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
  #q::placeholder{color:#A79C8D}
  .go{
    flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--ink);color:#FFF8EF;
    font-size:12.5px;font-weight:700;letter-spacing:.02em;
  }
  .go:active{transform:scale(.97)}
  .sugg{
    position:absolute;left:0;right:0;top:54px;z-index:30;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 22px 50px -20px rgba(34,30,26,.4);
    padding:6px;display:none;max-height:46vh;overflow:auto;
  }
  .sugg.on{display:block}
  .sugg button{
    display:flex;width:100%;text-align:left;gap:10px;align-items:center;
    padding:9px 10px;border-radius:11px;
  }
  .sugg button:hover,.sugg button:focus-visible{background:var(--cream-2)}
  .sugg .nm{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .sugg .mt{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
  .sugg .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .sugg .live{padding:10px;font-size:12.5px;color:var(--ink-soft)}

  /* ---------- 사진(카메라) 검색 ---------- */
  .search-box .cam{
    flex:none;position:relative;width:36px;height:36px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;
    background:#F7EFE4;border:1px solid #EFDFC9;color:#8A5A2B;
    transition:background .16s ease,border-color .16s ease,transform .12s ease;
  }
  /* 보이는 원은 36px, 손가락이 닿는 영역은 44px로 */
  .search-box .cam::after{content:"";position:absolute;inset:-4px;border-radius:999px}
  .search-box .cam svg{color:currentColor}
  .search-box .cam:hover{background:#F1E3CE;border-color:#E3CDAE}
  .search-box .cam:active{transform:scale(.93)}
  .search-box .cam:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
  .search-box .cam[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#FFF8EF}

  /* 사진 고르기 모달 */
  html.ps-lock,html.ps-lock body{overflow:hidden}
  .psback{
    position:fixed;inset:0;z-index:10050;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(34,30,26,.52);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .psback[hidden]{display:none}
  .psmodal{
    width:100%;max-width:460px;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-bottom:0;
    border-radius:20px 20px 0 0;box-shadow:0 -18px 50px -24px rgba(34,30,26,.55);
    padding:16px 18px calc(14px + env(safe-area-inset-bottom));animation:psup .24s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes psup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media(min-width:600px){
    .psback{align-items:center;padding:18px}
    .psmodal{border-radius:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
  }
  .pshead{display:flex;align-items:flex-start;gap:10px}
  .pshead h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .pshead p{margin:4px 0 0;font-size:11.5px;line-height:1.55;color:var(--ink-soft);word-break:keep-all}
  .psx{flex:none;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:15px;line-height:1}
  .psx:hover{background:var(--cream-2);color:var(--ink)}
  .psopt{
    display:flex;width:100%;text-align:left;align-items:center;gap:11px;
    margin-top:8px;padding:12px 13px;border-radius:14px;
    background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(34,30,26,.5);
    transition:border-color .16s ease,background .16s ease;
  }
  .psopt:hover,.psopt:focus-visible{border-color:var(--terra);background:#FFFCF7}
  .psopt .ic{
    flex:none;width:38px;height:38px;border-radius:11px;background:#F7EFE4;color:#8A5A2B;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .psopt .tx{min-width:0}
  .psopt .t{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
  .psopt .d{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
  .pshint{margin:11px 2px 0;font-size:10.5px;line-height:1.6;color:#A79C8D}

  /* 인식 패널 — .sheet 맨 위 */
  .pspanel{
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;
    box-shadow:var(--shadow);margin:0 0 14px;animation:rise .28s cubic-bezier(.2,.7,.3,1) both;
  }
  .pspanel .psphead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .pspanel .psphead h2{margin:0;font-size:14px;font-weight:800;letter-spacing:-.02em}
  .pspanel .psphead .psx{margin-left:auto}
  .psrow{display:flex;gap:11px;align-items:flex-start}
  .psrow img{
    flex:none;width:74px;height:74px;border-radius:11px;object-fit:contain;
    border:1px solid var(--line);background:var(--cream-2);display:block;
  }
  .psstate{flex:1;min-width:0}
  .psstate .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.45}
  .psstate .lbl .pct{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:#9A8F80}
  .psbar{height:5px;border-radius:3px;background:var(--cream-2);overflow:hidden;margin-top:7px}
  .psbar i{display:block;height:100%;width:0;background:var(--terra);border-radius:3px;transition:width .3s ease}
  .psstate.ok .lbl{color:#37563C}
  .psstate.ok .psbar i{background:#7E9478}
  .psstate.fail .lbl{color:#8A4A2B}
  .psstate.fail .psbar{display:none}
  .psnote{margin:8px 0 0;font-size:10.5px;line-height:1.6;color:#A79C8D;word-break:keep-all}
  .psacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .psbtn{font-size:11.5px;font-weight:800;padding:8px 12px;border-radius:9px;background:var(--cream-2);color:var(--ink)}
  .psbtn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft)}
  .psbtn:active{transform:scale(.97)}
  .pstext{margin-top:12px}
  .pstext>.lbl{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:#9A8F80;text-transform:uppercase}
  .pstext textarea{
    display:block;width:100%;min-height:86px;margin-top:6px;resize:vertical;overflow:auto;
    font:inherit;font-size:12.5px;line-height:1.6;padding:9px 10px;
    border:1px solid var(--line);border-radius:10px;background:#FFFDF8;color:var(--ink);
  }
  .pstext textarea:focus{outline:0;border-color:var(--terra);box-shadow:0 0 0 3px rgba(194,96,60,.1)}
  .pscands{display:flex;flex-direction:column;gap:6px;margin-top:11px}
  .pscand{
    display:flex;width:100%;text-align:left;gap:9px;align-items:flex-start;
    background:#FFFDF6;border:1px solid var(--line);border-radius:11px;padding:10px 11px;
  }
  .pscand:hover,.pscand:focus-visible{border-color:var(--terra);background:#FFF9F1}
  .pscand .bdg{
    flex:none;margin-top:1px;font-size:9px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    padding:3px 6px;border-radius:5px;background:var(--cream-2);color:#8A5A2B;text-transform:uppercase;
  }
  .pscand .bdg.bean{background:#E7EEE4;color:#37563C}
  .pscand .bdg.farm{background:#F6EBDD;color:#8A5A2B}
  .pscand .bdg.country{background:#EFEAE1;color:#6B6259}
  .pscand .tx{min-width:0;flex:1}
  .pscand .nm{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
  .pscand .mt{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
  .pscand .mt b{color:var(--terra);font-weight:800}
  .pscand .arw{flex:none;color:var(--terra);font-size:15px;font-weight:800;padding-top:1px;line-height:1.2}
  @media(max-width:400px){
    .search-box{gap:6px}
    .pspanel{padding:12px}
    .psrow img{width:64px;height:64px}
  }

  /* ---------- chips ---------- */
  .chips{
    flex:none;display:flex;gap:7px;overflow-x:auto;padding:12px 18px 12px;
    scrollbar-width:none;background:var(--cream);position:relative;z-index:4;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;transition:all .16s ease;
  }
  .chip.on{background:var(--ink);border-color:var(--ink);color:#FFF8EF}
  .chip.on .cnt{color:var(--terra-soft)}
  .chip .cnt{font-size:10.5px;opacity:.7;font-weight:700}

  /* ---------- 가공방식 필터 ---------- */
  .chips.pf{padding:0 18px 9px;gap:6px;align-items:center}
  .chips.pf .plabel,.chips.detail .plabel{
    flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;color:#A79C8D;
    padding-right:3px;white-space:nowrap;text-transform:uppercase;
  }
  .chips.pf .chip{height:27px;padding:0 10px;font-size:11.5px;gap:4px}
  .chips.pf .chip.on{background:var(--green);border-color:var(--green);color:#FFF8EF}
  .chips.pf .chip.on .cnt{color:#CBDCC5}
  .chips.detail{padding:0 18px 9px;gap:5px;align-items:center}
  .chips.detail .chip{height:24px;padding:0 9px;font-size:11px;gap:4px;background:#FFFDF8}
  .chips.detail .chip.on{background:#8A5A2B;border-color:#8A5A2B;color:#FFF8EF}
  .chips.detail .chip.on .cnt{color:#F2DEC8}
  .chips[hidden]{display:none}

  /* 원두 목록·카드 안의 가공방식 배지 — 누르면 설명이 뜹니다 */
  .proc{
    display:inline-flex;align-items:center;border-radius:5px;font-weight:700;font-style:normal;
    color:#8A5A2B;background:#F7EFE4;border:1px solid #EFDFC9;padding:0 5px;line-height:1.5;
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;
    cursor:pointer;letter-spacing:-.01em;
  }
  .proc:hover,.proc:focus-visible{background:#F1E3CE;border-color:#E3CDAE;outline:none}
  .proc.lg{font-size:12.5px;padding:1px 7px}

  /* 가공방식 설명 모달 */
  .pmback{
    position:fixed;inset:0;z-index:10060;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(34,30,26,.52);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .pmback[hidden]{display:none}
  .pmmodal{
    width:100%;max-width:520px;max-height:86dvh;overflow:auto;background:var(--cream);color:var(--ink);
    border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px -24px rgba(34,30,26,.55);animation:psup .24s cubic-bezier(.2,.7,.3,1) both;
  }
  @media(min-width:600px){ .pmback{align-items:center;padding:20px} .pmmodal{border-bottom:1px solid var(--line);border-radius:20px} }
  .pmhead{display:flex;align-items:flex-start;gap:12px}
  .pmhead .kick{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:2px}
  .pmhead h2{margin:0;font-size:19px;line-height:1.3;letter-spacing:-.02em}
  .pmx{
    margin-left:auto;flex:none;width:34px;height:34px;border-radius:999px;background:#F1E9DC;
    color:var(--ink-soft);font-size:14px;display:inline-flex;align-items:center;justify-content:center;
  }
  .pmx:hover{background:#E9DFCE}
  .pmsum{margin:10px 0 0;font-size:14px;font-weight:600;line-height:1.6;color:var(--ink)}
  .pmnote{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
  .pmsec{border-top:1px solid var(--line);margin-top:11px;padding-top:9px}
  .pmsec dt{font-size:10px;font-weight:800;letter-spacing:.08em;color:#A79C8D;text-transform:uppercase;margin-bottom:3px}
  .pmsec dd{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
  .pmfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .pmlink,.pmfilter{
    display:inline-flex;align-items:center;height:36px;padding:0 13px;border-radius:999px;
    font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;
  }
  .pmlink{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .pmfilter{background:var(--green);color:#FFF8EF;border:1px solid var(--green)}
  .pmlink:hover{border-color:var(--terra);color:var(--terra)}

  /* ---------- map ----------
     touch-action:none — 폴드 펼친 화면·태블릿에서 두 손가락 핀치가 브라우저 페이지 확대로
     빠지지 않고 Leaflet 지도 확대로 전달되게 합니다. */
  .mapwrap, #map, .leaflet-container{touch-action:none}
  .mapwrap{position:relative;flex:none;height:40dvh;min-height:240px;background:var(--cream-2);z-index:1}
  #map{position:absolute;inset:0;background:var(--cream-2)}
  .leaflet-container{font-family:inherit;background:#EFE7DA}
  .leaflet-tile-pane{filter:sepia(.12) saturate(.9) brightness(1.02)}
  .leaflet-control-attribution{font-size:9.5px!important;background:rgba(251,247,240,.86)!important;color:#6B6259!important}
  .leaflet-control-attribution a{color:#6B6259!important}
  .leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important;margin:10px 10px 0 0!important}
  .leaflet-control-zoom a{background:#fff!important;color:var(--ink)!important;border-color:var(--line)!important;width:30px!important;height:30px!important;line-height:28px!important;font-size:16px!important}

  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
    background:var(--green);border:2.5px solid #FFFDF8;
    box-shadow:0 4px 12px -4px rgba(34,30,26,.55);
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;
  }
  .pin i{transform:rotate(45deg);font-style:normal;font-size:10px;font-weight:800;color:#FFFDF8;letter-spacing:-.03em}
  .pin.farm{background:#9A5B2E}
  .pin.country{background:#8C8377}
  .cluster{
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:#FFFDF8;border:2px solid var(--green);color:var(--ink);
    font-size:12px;font-weight:800;letter-spacing:-.02em;
    box-shadow:0 6px 16px -8px rgba(34,30,26,.6);
  }
  .cluster.warm{border-color:var(--terra);color:var(--terra)}
  .cluster span{transform:translateY(0)}
  .pin.sel{transform:rotate(-45deg) scale(1.22);box-shadow:0 8px 20px -6px rgba(34,30,26,.6)}
  .pin-wrap.sel::after{
    content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;border:2px solid rgba(194,96,60,.45);animation:pulse 1.9s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.25);opacity:0}}

  .map-hint{
    position:absolute;left:14px;bottom:12px;z-index:500;display:flex;align-items:center;gap:6px;
    background:rgba(255,253,248,.94);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:999px;padding:6px 11px;font-size:10.5px;font-weight:600;color:var(--ink-soft);
    box-shadow:var(--shadow);pointer-events:none;max-width:calc(100% - 28px);
  }
  .map-hint b{color:var(--terra);font-weight:800}
  /* 좁은 지도(1단·폴드 2단)에서는 지도 저작자 표기 위로 올려 겹치지 않게 */
  @media(max-width:899px){
    .map-hint{bottom:23px;font-size:10px;padding:5px 9px;max-width:calc(100% - 20px);line-height:1.55}
  }
  .lt-tip{
    background:#FFFDF8!important;border:1px solid var(--line)!important;border-radius:10px!important;
    color:var(--ink)!important;font-size:11.5px!important;font-weight:700!important;
    box-shadow:var(--shadow)!important;padding:4px 8px!important;
  }
  .lt-tip::before{border-top-color:#FFFDF8!important}
  .lt-tip span{color:var(--ink-soft)!important;font-weight:500!important;display:block;font-size:10px!important}

  /* ---------- sheet ---------- */
  .sheet{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 40px;background:var(--cream)}
  .sheet::-webkit-scrollbar{width:0}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:18px;box-shadow:var(--shadow);animation:rise .32s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* ---------- 산지·농장 사진: 무료 사진 + 출처·라이선스 + 사진 저장 ---------- */
  .cardph{margin:0 0 14px;border-radius:12px;overflow:hidden;background:var(--cream-2);border:1px solid var(--line)}
  .cardph .phimg{position:relative;line-height:0}
  .cardph img{display:block;width:100%;height:186px;object-fit:cover;object-position:center 45%;background:var(--cream-2)}
  .cardph.small{margin-bottom:12px}
  .cardph.small img{height:132px}
  .cardph .phdl{
    position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;
    font:inherit;font-size:10.5px;font-weight:800;letter-spacing:.01em;line-height:1;
    padding:6px 9px;border-radius:999px;border:1px solid rgba(0,0,0,.10);
    background:rgba(255,253,249,.94);color:#3D372F;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.14);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .cardph .phdl:hover{background:#fff}
  .cardph .phdl.done{background:#E7EEE4;color:#37563C;border-color:#C9D8C7}
  .cardph figcaption{display:flex;flex-direction:column;gap:2px;padding:8px 10px 9px;background:#FFFDF9;border-top:1px solid var(--line);line-height:1.45}
  .cardph .phcap{font-size:11.5px;font-weight:600;color:#4B4238}
  .cardph .phattr{font-size:9.5px;color:#8C8377;letter-spacing:.01em}
  .cardph .phattr a{color:#8A6A46;text-decoration:underline;text-underline-offset:2px}
  @media (max-width:520px){ .cardph img{height:158px} .cardph.small img{height:118px} }
  .eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--terra);text-transform:uppercase;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    padding:3px 7px;border-radius:5px;background:var(--cream-2);color:var(--ink-soft);text-transform:uppercase;
  }
  .badge.ok{background:#E7EEE4;color:#37563C}
  .badge.region{background:#F6EBDD;color:#8A5A2B}
  .badge.sample{background:#E8EDF4;color:#3C5573}
  .badge.live{background:#EFE9E2;color:#4B4238}
  .badge.auc{background:#F6E3CB;color:#8A4B22;letter-spacing:.04em}
  .badge.jp{background:#EDEAF6;color:#4B4376;letter-spacing:.04em;text-transform:none}
  .res .tag.jp{background:#EDEAF6;color:#4B4376;text-transform:none;letter-spacing:.02em}

  /* ---------- auction lots won by Korean buyers ---------- */
  .auctions{margin:14px 0 0;padding:13px;background:#FFF8EC;border:1px solid #EEDCBE;border-radius:12px}
  .auctions h3{margin:0 0 9px;font-size:10.5px;font-weight:800;letter-spacing:.13em;color:#9A6A34;text-transform:uppercase}
  .auctions ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .aucrow{background:#fff;border:1px solid #F0E3CC;border-radius:10px;padding:8px 10px}
  .auc1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:800;color:#3D372F}
  .auc1 .auc-rank{font-size:11px;font-weight:800;color:#8A4B22;background:#F8EAD6;border-radius:5px;padding:1px 6px}
  .auc2{margin-top:3px;font-size:11px;line-height:1.55;color:#6B6259}
  .auc3{margin-top:4px;font-size:11px;line-height:1.55;color:#3D372F}
  .auc3 .k{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#9A8F80;text-transform:uppercase;margin-right:5px}
  .auc3 .joint{font-size:9px;font-weight:800;color:#8A5A2B;background:#F6EBDD;border-radius:4px;padding:1px 5px;margin-left:4px}
  .auc-src{margin-top:5px;display:inline-block;font-size:10.5px;font-weight:700;color:#8A6A46;text-decoration:underline;text-underline-offset:2px}
  .res .tag.auc{background:#F6E3CB;color:#8A4B22}

  .c-name{margin:9px 0 0;font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.28;word-break:keep-all;overflow-wrap:break-word}
  .c-en{margin:4px 0 0;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .c-region{margin:10px 0 0;font-size:13px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px}
  .c-region svg{flex:none}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:16px 0 0;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .stat{background:#FFFDF8;padding:10px 12px}
  .stat dt{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:#9A8F80;text-transform:uppercase;margin:0}
  .stat dd{margin:3px 0 0;font-size:13px;font-weight:700;letter-spacing:-.01em;word-break:keep-all}
  .stat.wide{grid-column:1/-1}

  .notes{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .note{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F7EFE4;color:#8A5A2B;border:1px solid #EFDFC9}

  .story{margin:16px 0 0;font-size:13.5px;line-height:1.72;color:#3D372F;word-break:keep-all}
  .story::first-letter{font-weight:800}

  .src{margin:16px 0 0;padding:12px 13px;background:var(--cream);border-radius:12px;border:1px dashed var(--line)}
  .src .row{display:flex;gap:8px;font-size:11.5px;line-height:1.6;color:var(--ink-soft)}
  .src .row + .row{margin-top:5px}
  .src .k{flex:none;font-weight:800;color:#9A8F80;letter-spacing:.04em;font-size:10px;padding-top:2px;width:52px}
  .src a{color:var(--terra);text-decoration:none;border-bottom:1px solid var(--terra-soft)}

  .qr{margin:14px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .qr code{
    flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    background:#F7F2E9;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4B4238;
  }
  .qr-note{margin:7px 0 0;font-size:10.5px;color:#A79C8D;line-height:1.55}
  .copy{flex:none;font-size:11.5px;font-weight:800;padding:9px 13px;border-radius:9px;background:var(--ink);color:#FFF8EF}
  .copy.done{background:var(--green)}
  .qracts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
  .qrbtn{display:inline-flex;align-items:center;gap:5px;background:var(--terra);color:#FFF8EF}
  .qrbtn:hover{background:#A94F2E}
  .qrbtn svg{flex:none}

  /* QR 만들기 모달 */
  html.qr-lock{overflow:hidden}
  .qrback{
    position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:14px;background:rgba(34,30,26,.56);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .qrmodal{
    width:100%;max-width:520px;max-height:92dvh;display:flex;flex-direction:column;
    background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 24px 60px -24px rgba(34,30,26,.55);overflow:hidden;
  }
  .qrhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 11px;border-bottom:1px solid var(--line);flex:none}
  .qrhead h2{margin:0;font-size:16px;letter-spacing:-.01em}
  .qrhead p{margin:4px 0 0;font-size:11.5px;color:var(--ink-soft);line-height:1.5}
  .qrx{flex:none;border:0;background:none;color:var(--ink-soft);font-size:16px;width:30px;height:30px;border-radius:8px;cursor:pointer;line-height:1}
  .qrx:hover{background:var(--cream-2);color:var(--ink)}
  .qrbody{padding:14px 18px 18px;overflow-y:auto}
  .qrprev{display:flex;justify-content:center}
  .qrprev canvas{display:block;height:auto;border-radius:12px;box-shadow:0 10px 26px -16px rgba(34,30,26,.55)}
  .qrprev img{display:block;height:auto;border-radius:12px;box-shadow:0 10px 26px -16px rgba(34,30,26,.55);-webkit-touch-callout:default}
  .qrfield{display:block;margin:0 0 11px}
  .qrfield-k{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;letter-spacing:-.01em}
  .qrfield-in{
    width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:#FFFDF9;color:var(--ink);
    padding:9px 11px;font-size:13.5px;font-weight:600;font-family:inherit;line-height:1.4;
  }
  .qrfield-in::placeholder{color:#B3A897;font-weight:500}
  .qrfield-in:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 3px rgba(194,96,60,.13)}
  .qrlong{margin:8px 0 0;text-align:center;font-size:10.5px;color:#A79C8D;line-height:1.5}
  .qrurl{margin:12px 0 0}
  .qrurl code{
    display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
    background:#F7F2E9;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
    color:#4B4238;word-break:break-all;line-height:1.5;
  }
  .qrbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .qrbtn-save,
  .qrbtn-copy,
  .qrbtn-close{
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
    padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .qrbtn-save{background:var(--terra);border-color:var(--terra);color:#FFF8EF}
  .qrbtn-save.done{background:var(--green);border-color:var(--green)}
  .qrbtn-save:hover{background:#A94F2E;border-color:#A94F2E}
  .qrbtn-save.done:hover{background:var(--green);border-color:var(--green)}
  .qrbtn-copy:hover,.qrbtn-close:hover{background:var(--cream-2)}
  .qrhint{margin:10px 0 0;font-size:10.5px;color:#A79C8D;line-height:1.6}
  @media (max-width:520px){ .qrbody{padding:10px 12px 14px} .qrhead{padding:14px 14px 10px} }


  /* results list */
  .results{margin:0}
  .res-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .res-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .res-head span{font-size:11.5px;color:var(--ink-soft)}
  .res{display:flex;width:100%;text-align:left;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
  .res.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(194,96,60,.16)}
  .res .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
  .res .rn{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  .res .rm{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
  .res .rt{display:block;font-size:10.5px;font-weight:800;color:var(--terra);margin-top:3px;letter-spacing:.02em}

  /* farm / origin rows in search results */
  .res.places{border-color:#E7DCC9;background:#FFFDF6}
  .res .tag{display:inline-flex;align-items:center;font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--cream-2);color:#8A5A2B;margin-left:6px;vertical-align:1px;text-transform:uppercase}
  .sec-h{margin:16px 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.13em;color:#9A8F80;text-transform:uppercase}

  /* live re-lookup for country-level beans */
  .refine{margin:14px 0 0;padding:12px 13px;background:#FFFDF6;border:1px solid #EADFCB;border-radius:12px}
  .refine p{margin:0;font-size:11.5px;line-height:1.6;color:var(--ink-soft)}
  .refine .rbtn{
    margin-top:9px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
    padding:8px 12px;border-radius:9px;background:var(--green);color:#FFF8EF;
  }
  .refine .rbtn[disabled]{opacity:.6}
  .refine .out{margin-top:10px}
  .refine .hit{
    display:flex;width:100%;text-align:left;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;margin-top:6px;
  }
  .refine .hit .hn{display:block;font-size:12px;font-weight:800}
  .refine .hit .hd{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
  .refine .hit .go{flex:none;font-size:10.5px;font-weight:800;color:var(--terra);padding-top:2px}

  .story2{margin:16px 0 0;padding:14px;background:#FFFDF6;border:1px solid #EADFCB;border-radius:12px}
  .story2 h3,.awards h3,.revbox h3{margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.13em;color:#9A8F80;text-transform:uppercase}
  .story2 p{margin:0;font-size:12.5px;line-height:1.75;color:#3D372F;word-break:keep-all}
  /* 산지 정보(테루아) 패널 — 고도·수확기·토양·품종·가공·향미·동향 */
  .terra{margin:16px 0 0;padding:13px 13px 11px;background:#F7F4EC;border:1px solid #E6DDCD;border-radius:12px}
  .terra h3{margin:0 0 9px;font-size:10.5px;font-weight:800;letter-spacing:.13em;color:#9A8F80;text-transform:uppercase}
  .terra dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:0;background:#E6DDCD;border-radius:9px;overflow:hidden}
  .terra dl>div{background:#FFFDF8;padding:8px 10px;min-width:0}
  .terra dl>div.wide{grid-column:1/-1}
  .terra dt{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#9A8F80;text-transform:uppercase;margin:0}
  .terra dd{margin:3px 0 0;font-size:12px;font-weight:700;line-height:1.55;color:#3D372F;word-break:keep-all;overflow-wrap:anywhere}
  .terra .tn{margin:8px 0 0;font-size:10.5px;line-height:1.55;color:#A79C8D}
  @media (max-width:470px){.terra dl{grid-template-columns:1fr}}
  .facts{display:grid;grid-template-columns:1fr;gap:1px;margin:11px 0 0;background:#EFE6D6;border-radius:9px;overflow:hidden}
  .facts div{background:#FFFDF6;padding:7px 10px;display:flex;gap:8px;font-size:11.5px;line-height:1.55}
  .facts dt{flex:none;width:46px;font-weight:800;color:#9A8F80;font-size:10px;padding-top:2px;letter-spacing:.03em}
  .facts dd{margin:0;font-weight:700;color:#3D372F}
  .awards{margin:14px 0 0}
  .awards ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .awards li{position:relative;font-size:11.5px;font-weight:700;line-height:1.55;color:#6B4A28;background:#FBF3E3;border:1px solid #EFDFC9;border-radius:9px;padding:7px 10px 7px 26px}
  .awards li::before{content:"★";position:absolute;left:9px;top:6px;color:#C2603C;font-size:11px}

  /* comments from roasters */
  .revbox{margin:16px 0 0;padding:13px;background:#F8F5EF;border:1px solid var(--line);border-radius:12px}
  .revlist{display:flex;flex-direction:column;gap:6px}
  .revlist .empty-rev{font-size:11.5px;line-height:1.6;color:#9A8F80}
  .revitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .revitem .rh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
  .revitem .who{font-weight:800;color:#3D372F}
  .revitem .roast{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:#EFE9DF;color:#6B5B45;text-transform:uppercase}
  .revitem .when{margin-left:auto;font-size:10px;color:#A79C8D}
  .revitem .rt2{margin:4px 0 0;font-size:12px;line-height:1.6;color:#3D372F;word-break:keep-all}
  .revform{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .revform input,.revform select,.revform textarea{
    width:100%;font:inherit;font-size:11.5px;padding:8px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);min-width:0;
  }
  .revform .wide{grid-column:1/-1}
  .revform button{grid-column:1/-1;font-size:11.5px;font-weight:800;padding:9px;border-radius:9px;background:var(--ink);color:#FFF8EF}
  .revform button:disabled{opacity:.6}
  .revnote{margin:7px 0 0;font-size:10px;line-height:1.55;color:#A79C8D}

  .empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center}  .empty h3{margin:0 0 6px;font-size:14.5px;font-weight:800}
  .empty p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.65}
  .empty .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .empty .tags button{font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--cream-2);color:var(--ink-soft)}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--terra);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .foot{margin-top:22px;font-size:10.5px;line-height:1.7;color:#A79C8D;text-align:center}
  .foot b{color:#8A8074;font-weight:700}
  .foot a{color:#8A8074;text-decoration:none;font-weight:700;border-bottom:1px solid #E2D8C9}
  .foot a:hover{color:var(--terra);border-bottom-color:var(--terra-soft)}

  /* ---------- site links (guide · farms · about · privacy) ---------- */
  .sitelinks{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;margin:7px 0 0}
  .sitelinks a{
    font-size:11.5px;font-weight:700;color:var(--ink-soft);text-decoration:none;
    letter-spacing:-.01em;padding:2px 0;transition:color .16s ease;
  }
  .sitelinks a:hover,.sitelinks a:focus-visible{color:var(--terra)}
  .sitelinks .sep{color:#CBBFAE;font-weight:600;font-size:11.5px}
  .sitelinks a[aria-current="page"]{color:var(--terra)}
  /* 내 커피 기록 — 크림 배경에 어울리는 그린 알약 버튼 */
  .sitelinks a.nav-log,.sitelinks a.nav-log:visited{
    background:var(--navlog);color:#FBF7F0;font-weight:800;
    font-size:13.5px;line-height:1.35;letter-spacing:-.02em;
    padding:6px 14px;margin:3px 5px;border-radius:999px;
    box-shadow:0 8px 18px -10px rgba(37,75,59,.9);
  }
  .sitelinks a.nav-log:hover,.sitelinks a.nav-log:focus-visible{
    background:var(--navlog-deep);color:#FFFDF8;
  }
  .sitelinks a.nav-log:focus-visible{outline:2px solid var(--navlog);outline-offset:2px}

<script>
/* =========================================================
   ONCOFFEELOG · 온커피로그 (KRUMBLE ROASTERS)  v0.3
   - CATALOG: 국내 유통 생두 카탈로그 (beans.json)
   ========================================================= */

const state = {
  filter: "all",        // all | auction | country:<name>
  query: "",
  bean: null,           // 선택된 카탈로그 생두
  place: null,          // 선택된 장소
  results: null,
  proc: "all",          // 가공방식 상위 갈래 (CI_PROCESS.chips)
  procDetail: "",       // 세부 가공방식 id (비어 있으면 갈래 전체)
  ready: false
};
var PS_ON = false;      // 사진 검색 패널이 시트에 붙어 있는지

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = (s) => String(s ?? "").toLowerCase().replace(/[\s·,.\-_/()]/g, "");
const qEl = $("#q");
const sugEl = $("#sugg");
const sheetEl = $("#sheet");
const appEl = $("#app");

/* ---------- 데이터 ---------- */
let CAT = { meta: {}, places: [], beans: [] };
const placeById = new Map();
const beansByPlace = new Map();

function placeLabel(p) {
  if (p.kind === "country") return p.name;
  return p.name;
}

function pinTier(p) {
  return p.kind === "farm" ? "farm" : (p.kind === "country" ? "country" : "origin");
}

async function loadCatalog() {
  const res = await fetch("beans.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("beans.json " + res.status);
  CAT = await res.json();
  if (window.CI && CI.i18n) CI.i18n.useCatalog(CAT);
  for (const p of CAT.places) placeById.set(p.id, p);
  for (const b of CAT.beans) {
    if (!beansByPlace.has(b.placeId)) beansByPlace.set(b.placeId, []);
    beansByPlace.get(b.placeId).push(b);
  }
  for (const arr of beansByPlace.values()) arr.sort((a, b) => (b.listingCount || 1) - (a.listingCount || 1));
  state.ready = true;
}

/* ---------- 지도 ---------- */
const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  worldCopyJump: true,
  touchZoom: true,
  minZoom: 2,
  maxZoom: 15
}).setView([12, 20], 2);

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: "지도 © Esri, HERE, Garmin, OpenStreetMap contributors",
  maxZoom: 16
}).addTo(map);
// 지명 라벨(농장·산지 단위로 들어갔을 때 위치를 읽을 수 있게)
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16,
  pane: "overlayPane"
}).addTo(map);

const clusterLayer = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 8,
  maxClusterRadius: 48,
  iconCreateFunction: (cluster) => {
    let n = cluster.getAllChildMarkers().reduce((sum, m) => sum + (m.options.beanCount || 0), 0);
    if (!n) n = cluster.getChildCount();   // 낙찰 랏만 있는 산지는 생두 수 대신 산지 수를 보여 줍니다
    const size = Math.min(54, 34 + Math.round(Math.log10(Math.max(n, 1)) * 9));
    const cls = n >= 100 ? "cluster warm" : "cluster";
    return L.divIcon({
      html: `<div class="${cls}" style="width:${size}px;height:${size}px"><span>${n >= 1000 ? Math.round(n / 100) / 10 + "k" : n}</span></div>`,
      className: "cluster-wrap",
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }
}).addTo(map);
// 지도가 화면에 고정(fixed)·동적 높이(dvh)인 환경(폴드 4:3·펼친 화면·데스크톱)에서 창 폭·높이가 바뀌면(주소창 접힘, 회전, 펼침) 지도 크기를 다시 잡습니다.
if (window.ResizeObserver) {
  const mapBox = document.querySelector(".mapwrap");
  if (mapBox) {
    let lastMapW = Math.round(mapBox.getBoundingClientRect().width);
    let lastMapH = Math.round(mapBox.getBoundingClientRect().height);
    new ResizeObserver(() => {
      const box = mapBox.getBoundingClientRect();
      const w = Math.round(box.width), h = Math.round(box.height);
      if ((h > 0 && Math.abs(h - lastMapH) > 2) || (w > 0 && Math.abs(w - lastMapW) > 2)) {
        lastMapW = w; lastMapH = h; map.invalidateSize({ animate: false });
      }
    }).observe(mapBox);
  }
}
const markers = new Map();

// 창 크기가 바뀌면(폴드 접기·펼치기, 회전, 주소창 접힘) 지도 영역을 다시 계산합니다.
// resize 이벤트가 연달아 오므로 짧게 모아(디바운스) 한 번만 invalidateSize를 부릅니다.
(function () {
  let t = 0;
  const refresh = () => {
    clearTimeout(t);
    t = setTimeout(() => { try { map.invalidateSize({ animate: false }); } catch (e) {} }, 120);
  };
  window.addEventListener("resize", refresh, { passive: true });
  window.addEventListener("orientationchange", refresh, { passive: true });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", refresh, { passive: true });
  document.addEventListener("ci:lang", refresh);
})();

function pinIcon(item) {
  const t = item.tier;
  const cls = ["pin"];
  if (t === "farm") cls.push("farm");
  if (t === "country") cls.push("country");
  if (state.place && state.place.id === item.id) cls.push("sel");
  const label = item.count > 999 ? "999" : (item.count ? String(item.count) : (item.place && item.place.auctionCount ? "🏆" : ""));
  return L.divIcon({
    className: "pin-wrap",
    html: `<div class="${cls.join(" ")}"><i>${esc(label)}</i></div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 25]
  });
}

function visibleItems() {
  const out = [];
  if (!state.ready) return out;
  for (const p of CAT.places) {
    if (state.filter.startsWith("country:") && p.country !== state.filter.slice(8)) continue;
    if (state.filter === "auction" && !p.auctionCount) continue;
    const n = p.beanCount || (beansByPlace.get(p.id) || []).length;
    let count = n;
    if (procFilterOn()) {
      /* 가공방식으로 좁히면 그 방식의 생두가 있는 곳만, 숫자도 그 방식 기준으로 */
      const hit = (beansByPlace.get(p.id) || []).filter(beanMatchesProc).length;
      if (!hit) continue;
      count = hit;
    }
    out.push({ id: p.id, tier: pinTier(p), lat: p.lat, lon: p.lon, name: p.name, sub: `${p.country} · ${count}종`, place: p, count });
  }
  return out;
}

function drawPins() {
  clusterLayer.clearLayers();
  markers.clear();
  const items = visibleItems();
  for (const item of items) {
    const m = L.marker([item.lat, item.lon], { icon: pinIcon(item), title: item.name, keyboard: false, beanCount: item.count || 0 });
    m.bindTooltip(`<b>${esc(item.name)}</b><span>${esc(item.sub)}</span>`, { direction: "top", offset: [0, -18], className: "lt-tip" });
    m.on("click", () => selectPlace(item.place));
    m.addTo(clusterLayer);
    markers.set(item.id, m);
  }
  drawPins.lastCount = items.length;
  updateHint();
}

function fitVisible() {
  const items = visibleItems();
  const pts = items.map((i) => [i.lat, i.lon]);
  if (!pts.length) return;
  if (pts.length === 1) { map.flyTo(pts[0], 7, { duration: .8 }); return; }
  map.flyToBounds(pts, { padding: [34, 34], duration: .8, maxZoom: 7 });
}

function updateHint() {
  const el = $("#mapHint");
  if (!state.ready) { el.innerHTML = `<span class="spin"></span>카탈로그를 불러오는 중…`; return; }
  const n = markers.size;
  const c = CAT.meta?.counts || {};
  const narrowMap = ($("#map")?.clientWidth || window.innerWidth) < 340;
  if (state.filter === "auction") {
    const pw = tr({ ko: "곳", en: " places", ja: "か所" });
    const lotW = tr({ ko: "낙찰 랏", en: "lots won", ja: "落札ロット" });
    const lab = tr({ ko: "옥션 낙찰 산지·농장", en: "Auction origins and farms", ja: "オークション落札の産地・農園" });
    el.innerHTML = narrowMap
      ? `<b>${n}</b>${pw} · ${lotW} <b>${(c.auctions || 0).toLocaleString()}</b>`
      : `${lab} <b>${n}</b>${pw} · ${lotW} <b>${(c.auctions || 0).toLocaleString()}</b>`;
    return;
  }
  if (procFilterOn()) {
    const hit = procScopeBeans().filter(beanMatchesProc).length;
    const pw = tr({ ko: "곳", en: " places", ja: "か所" });
    const bw = tr({ ko: "종", en: " beans", ja: "種" });
    el.innerHTML = `<b>${n}</b>${pw} · ${esc(procFilterName())} ${hit.toLocaleString()}${bw}`;
    return;
  }
  el.innerHTML = narrowMap
    ? `<b>${n}</b>곳 표시 · ${(c.beans || 0).toLocaleString()}종`
    : `<b>${n}</b>곳 표시 · 카탈로그 ${(c.beans || 0).toLocaleString()}종 / ${c.countries || 0}개국`;
}

/* ---------- 칩 ---------- */
function renderChips() {
  const el = $("#chips");
  const counts = new Map();
  if (state.ready) for (const p of CAT.places) counts.set(p.country, (counts.get(p.country) || 0) + (p.beanCount || 0));
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12);
  const chips = [];
  chips.push(`<button class="chip ${state.filter === "all" ? "on" : ""}" data-f="all">전체 카탈로그 <span class="cnt">${(CAT.meta?.counts?.beans || 0).toLocaleString()}</span></button>`);
  const nAuc = CAT.meta?.counts?.auctions || 0;
  if (nAuc) chips.push(`<button class="chip ${state.filter === "auction" ? "on" : ""}" data-f="auction">🏆 옥션·CoE <span class="cnt">${nAuc.toLocaleString()}</span></button>`);
  for (const [c, n] of top) {
    chips.push(`<button class="chip ${state.filter === "country:" + c ? "on" : ""}" data-f="country:${esc(c)}">${esc(c)} <span class="cnt">${n.toLocaleString()}</span></button>`);
  }
  el.innerHTML = chips.join("");
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    state.filter = b.dataset.f;
    state.bean = null; state.place = null; state.results = null;
    state.query = ""; qEl.value = "";
    renderChips(); renderSheet(); drawPins(); fitVisible(); syncUrl();
  }));
  renderProcChips();
}

/* ---------- 가공방식 필터 · 설명 모달 ----------
   가공방식 사전(process-data.js · CI_PROCESS)의 8개 갈래와 36종 세부 방식을
   국가·옥션 필터와 함께 좁혀 보고, 배지를 누르면 쉬운 설명이 뜨게 합니다.
   ------------------------------------------------ */
const PROC = window.CI_PROCESS || null;
function langIdx() { const l = uiLang(); return l === "en" ? 1 : (l === "ja" ? 2 : 0); }
function tr(v) {
  if (v == null) return "";
  if (Array.isArray(v)) return v[langIdx()] || v[0] || "";
  return v[uiLang()] || v.ko || "";
}
function uiStr(k) { return PROC && PROC.ui && PROC.ui[k] ? tr(PROC.ui[k]) : ""; }
function procFilterOn() { return !!(state.procDetail || (state.proc && state.proc !== "all")); }
function procIdOf(b) { return (b && b.processId) || (b && b.processUnverified ? "__unverified" : ""); }

/* 목록·카드의 가공방식 값. 누르면명 모달이 열립니다. */
function processBadge(b, cls) {
  if (!b) return "";
  const id = procIdOf(b);
  const p = id && PROC && PROC.processes[id] ? PROC.processes[id] : null;
  const label = p ? (uiLang() === "ko" ? (b.process || tr(p.label)) : tr(p.label)) : (b.process || "");
  if (!label) return "";
  if (!id) return esc(label);
  return `<span class="proc${cls ? " " + cls : ""}" role="button" tabindex="0" data-proc="${esc(id)}" data-ci-skip aria-label="${esc(label)}">${esc(label)}</span>`;
}

function beanMatchesProc(b) {
  if (!procFilterOn()) return true;
  if (state.procDetail) return b.processId === state.procDetail || (b.processTags || []).indexOf(state.procDetail) > -1;
  return b.processGroup === state.proc;
}

/* 지금 고른 국가·옥션 필터 안의 생두 (가공 칩 숫자도 이 범위로 셈) */
function procScopeBeans() {
  if (!state.ready) return [];
  if (!state.filter || state.filter === "all") return CAT.beans;
  const out = [];
  for (const b of CAT.beans) {
    const p = placeById.get(b.placeId);
    if (!p) continue;
    if (state.filter.startsWith("country:") && p.country !== state.filter.slice(8)) continue;
    if (state.filter === "auction" && !p.auctionCount) continue;
    out.push(b);
  }
  return out;
}

function procFilterName() {
  if (!PROC) return "";
  if (state.procDetail) {
    const p = PROC.processes[state.procDetail];
    return p ? tr(p.label) : state.procDetail;
  }
  if (!state.proc || state.proc === "all") return uiStr("filterAll") || "전체";
  const c = PROC.chips.find((x) => x.id === state.proc);
  if (c) return tr(c.label);
  const p = PROC.processes[state.proc];
  return p ? tr(p.label) : state.proc;
}

function procGroupCounts() {
  const m = {};
  if (!state.ready) return null;
  for (const b of procScopeBeans()) if (b.processGroup) m[b.processGroup] = (m[b.processGroup] || 0) + 1;
  return m;
}
function procSubCounts() {
  const m = {};
  if (!state.ready) return m;
  for (const b of procScopeBeans()) {
    const ids = [b.processId].concat(b.processTags || []);
    for (const id of ids) if (id) m[id] = (m[id] || 0) + 1;
  }
  return m;
}

function renderProcChips() {
  const row = $("#procChips"), det = $("#procDetail");
  if (!row || !det) return;
  if (!PROC) { row.hidden = true; det.hidden = true; return; }
  const counts = procGroupCounts();
  const total = counts ? procScopeBeans().length : ((PROC.counts && PROC.counts.beans) || 0);
  const out = [`<span class="plabel">${esc(uiStr("filterTitle") || "가공방식")}</span>`];
  out.push(`<button type="button" class="chip ${(!state.procDetail && state.proc === "all") ? "on" : ""}" data-p="all">${esc(uiStr("filterAll") || "전체")} <span class="cnt">${total.toLocaleString()}</span></button>`);
  for (const c of PROC.chips) {
    if (c.id === "all") continue;
    const n = counts ? (counts[c.id] || 0)
      : ((PROC.counts && PROC.counts.groups && PROC.counts.groups[c.id]) || 0);
    out.push(`<button type="button" class="chip ${(!state.procDetail && state.proc === c.id) ? "on" : ""}" data-p="${esc(c.id)}">${esc(tr(c.label))} <span class="cnt">${n.toLocaleString()}</span></button>`);
  }
  row.hidden = false;
  row.innerHTML = out.join("");
  row.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => {
    state.proc = b.dataset.p; state.procDetail = "";
    state.bean = null; state.place = null; state.results = null;
    state.query = ""; qEl.value = "";
    renderProcChips(); renderSheet(); drawPins(); fitVisible(); syncUrl();
  }));

  /* 갈래를 고르면 그 안의 세부 가공방식을 한 줄 더 보여 줍니다 (CM·ASD·써멀쇼크 등) */
  const subs = [];
  if (state.proc && state.proc !== "all") {
    const m = procSubCounts();
    for (const pid of PROC.order) {
      const p = PROC.processes[pid];
      if (!p) continue;
      if (p.chip !== state.proc) continue;
      if (state.ready && !(m[pid] > 0)) continue;
      subs.push({ id: pid, label: tr(p.label), n: m[pid] || 0 });
    }
    subs.sort((a, b) => b.n - a.n);
  }
  if (!subs.length) { det.hidden = true; det.innerHTML = ""; return; }
  const gcount = counts ? (counts[state.proc] || 0) : 0;
  det.innerHTML = [`<span class="plabel">${esc(uiStr("detail") || "세부")}</span>`,
    `<button type="button" class="chip detail ${state.procDetail ? "" : "on"}" data-d="">${esc(uiStr("filterAll") || "전체")} <span class="cnt">${gcount.toLocaleString()}</span></button>`]
    .concat(subs.map((s) => `<button type="button" class="chip detail ${state.procDetail === s.id ? "on" : ""}" data-d="${esc(s.id)}">${esc(s.label)} <span class="cnt">${s.n.toLocaleString()}</span></button>`))
    .join("");
  det.hidden = false;
  det.querySelectorAll("[data-d]").forEach((b) => b.addEventListener("click", () => {
    state.procDetail = b.dataset.d || "";
    state.bean = null; state.place = null; state.results = null;
    state.query = ""; qEl.value = "";
    renderProcChips(); renderSheet(); drawPins(); fitVisible(); syncUrl();
  }));
}

/* 세부 가공으로 좁혔을 때: 그 방식만 골라 보여 주는 목록 */
function procSheet() {
  const list = procScopeBeans().filter(beanMatchesProc);
  const name = procFilterName();
  const p = state.procDetail && PROC ? PROC.processes[state.procDetail] : null;
  const chip = !p && PROC ? PROC.chips.find((c) => c.id === state.proc) : null;
  const desc = p ? tr(p.summary) : (chip ? tr(chip.desc) : "");
  const bw = tr({ ko: "종", en: " beans", ja: "種" });
  return `<div class="results">
    <div class="res-head"><h2>${esc(name)}</h2><span>${esc(list.length.toLocaleString() + bw)}</span></div>
    ${desc ? `<p class="qr-note">${esc(desc)}</p>` : ""}
    ${list.length ? list.slice(0, 60).map(beanRow).join("") : `<p class="qr-note">${esc(uiStr("empty") || "이 가공의 생두가 아직 없습니다.")}</p>`}
    ${list.length > 60 ? `<p class="qr-note">상위 60종만 표시합니다. 검색어를 좁혀 보세요.</p>` : ""}
  </div>`;
}

/* ---------- 가공방식 설명 모달 ---------- */
function openProcModal(key) {
  if (!PROC) return;
  const back = $("#pmBack"), body = $("#pmBody"), ttl = $("#pmTitle"), kick = $("#pmKick");
  if (!back || !body || !ttl) return;
  let title = "", kicker = uiStr("modalTitle") || "가공방식", html = "";
  if (key === "__unverified") {
    title = uiStr("unverifiedTitle") || "의미를 확인하지 못한 표기";
    html = `<p class="pmsum">${esc(tr(PROC.unverified && PROC.unverified.VAP))}</p>
      <p class="pmnote">${esc(uiStr("unverifiedBody"))}</p>`;
  } else {
    const p = PROC.processes[key];
    if (!p) return;
    title = tr(p.label);
    const chip = PROC.chips.find((c) => c.id === p.chip);
    kicker = chip ? tr(chip.label) : (p.group || (uiStr("modalTitle") || "가공방식"));
    const secs = [
      [uiStr("how"), tr(p.how)],
      [uiStr("cup"), tr(p.cup)],
      [uiStr("roast"), tr(p.roast)],
      [uiStr("origins"), tr(p.origins)],
      [uiStr("caution"), tr(p.caution)]
    ].filter((x) => x[0] && x[1]);
    html = `<p class="pmsum">${esc(tr(p.summary))}</p>
      <dl>${secs.map(([k, v]) => `<div class="pmsec"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      <div class="pmfoot">
        <a class="pmlink" href="guide.html#process-${esc(key)}">${esc(uiStr("guideLink") || "가이드에서 더 읽기")} →</a>
        <button class="pmfilter" type="button" data-pmf="${esc(key)}">${esc(uiStr("filterNote") || "가공방식으로 좁혀 보기")}</button>
      </div>`;
  }
  if (kick) kick.textContent = kicker;
  ttl.textContent = title;
  body.innerHTML = html;
  back.hidden = false;
  const de = document.documentElement;
  if (de && de.classList) de.classList.add("pm-lock");
  const x = $("#pmClose"); if (x) { try { x.focus({ preventScroll: true }); } catch (e) {} }
}
function closeProcModal() {
  const back = $("#pmBack");
  if (back) back.hidden = true;
  const de = document.documentElement;
  if (de && de.classList) de.classList.remove("pm-lock");
}

/* 설명 모달의 "이 가공만 보기" — 지도 필터를 그 방식으로 바꿉니다 */
function applyProcFilter(id) {
  if (!PROC) return;
  const p = PROC.processes[id];
  if (!p) return;
  state.proc = p.chip || "all";
  state.procDetail = id;
  state.bean = null; state.place = null; state.results = null;
  state.query = ""; qEl.value = "";
  closeProcModal();
  renderProcChips(); renderSheet(); drawPins(); fitVisible(); syncUrl();
}
/* ?process= 딥링크 — 갈래 id도, 세부 방식 id도 받습니다 */
function applyProcParam(v) {
  if (!v || !PROC) return;
  if (PROC.chips.some((c) => c.id === v)) {
    state.proc = v; state.procDetail = "";
  } else if (PROC.processes[v]) {
    state.proc = PROC.processes[v].chip || "all"; state.procDetail = v;
  } else return;
  renderProcChips();
}

(function bindProcModal() {
  const back = $("#pmBack");
  if (!back) return;
  const x = $("#pmClose");
  if (x) x.addEventListener("click", closeProcModal);
  back.addEventListener("click", (e) => { if (e.target === back) closeProcModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !back.hidden) closeProcModal(); });
  const body = $("#pmBody");
  if (body) body.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-pmf]");
    if (b) applyProcFilter(b.dataset.pmf);
  });
})();

/* ---------- 카드 ---------- */
function precisionBadge(p) {
  const m = { farm: ["ok", "농장 좌표"], village: ["region", "마을 단위"], region: ["region", "산지 단위"], country: ["sample", "국가 단위"] };
  const [cls, label] = m[p.precision] || ["sample", "국가 단위"];
  return `<span class="badge ${cls}">${label}</span>`;
}

/* QR·공유용 딥링크는 실제 도메인으로 고정합니다. 인쇄물에 찍힌 QR이 그대로 살아 있도록. */
const SITE_URL = "https://oncoffeelog.com/";
function deepUrl(key, id) { return SITE_URL + "?" + key + "=" + encodeURIComponent(id); }

function qrButton(url, title, sub, name, hint) {
  return `<button class="copy qrbtn" type="button" data-qr data-qr-url="${esc(url)}" data-qr-title="${esc(title)}" data-qr-sub="${esc(sub || "")}" data-qr-name="${esc(name || title)}" data-qr-hint="${esc(hint || "스캔하면 이 산지의 페이지가 열립니다")}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h3.5v3.5H14zM21 14v3.5M14 21h3.5M21 21h.01"/></svg>QR 만들기</button>`;
}

function auctionBadge(p) {
  const n = p && p.auctionCount;
  return n ? `<span class="badge auc">🏆 옥션 낙찰 ${n}</span>` : "";
}

function uiLang() {
  return (window.CI && window.CI.i18n && window.CI.i18n.lang)
    || (document.documentElement && document.documentElement.getAttribute
        && document.documentElement.getAttribute("data-lang")) || "ko";
}

function setLede(c) {
  const el = $("#ledeSub");
  if (!el || !c) return;
  const l = uiLang();
  el.textContent = l === "ja"
    ? `韓国・日本に流通する生豆 ${c.beans.toLocaleString()}種 · ${c.places}か所の産地と農園`
    : l === "en"
      ? `${c.beans.toLocaleString()} green coffees traded in Korea and Japan · ${c.places} origins and farms`
      : `국내·일본에 유통되는 생두 ${c.beans.toLocaleString()}종 · ${c.places}곳의 산지와 농장`;
}

/* 카탈로그 이름·설명은 한국어를 기본으로 두고, 일본 유통 생두처럼 언어별 표기가 있는 항목은 그 언어를 씁니다. */
function beanName(b) {
  if (!b) return "";
  const l = uiLang();
  return (l === "ja" && b.nameJa) || (l === "en" && b.nameEn) || b.name || "";
}
function placeView(p) {
  if (!p) return p;
  const l = uiLang();
  const block = p.lang && p.lang[l];
  return block ? Object.assign({}, p, block) : p;
}
function jpTag(b) {
  return b && b.market === "jp" ? `<span class="tag jp">일본 내 유통</span>` : "";
}
function jpBadge(b) {
  return b && b.market === "jp" ? `<span class="badge jp">일본 내 유통</span>` : "";
}

function rankLabel(r) {
  const s = String(r || "");
  if (!s) return "";
  const lang = uiLang();
  if (/^[A-Za-z]{1,3}-\d+$/.test(s)) return lang === "ko" ? `랏 ${s}` : (lang === "ja" ? `ロット ${s}` : `Lot ${s}`);
  if (/^NW$/i.test(s)) return "NW";
  return lang === "ko" ? `${s}위` : (lang === "ja" ? `${s}位` : `#${s}`);
}

function auctionsBlock(p) {
  const a = p.auctions || [];
  if (!a.length) return "";
  const items = a.map((x) => {
    const rank = rankLabel(x.rank);
    const score = typeof x.score === "number" ? x.score.toFixed(2) : (x.score || "");
    const meta = [x.farm, [x.variety, x.process].filter(Boolean).join(" · ")].filter(Boolean).join(" — ");
    const names = uiLang() === "ko" ? x.buyers : ((x.buyersEn && x.buyersEn.length) ? x.buyersEn : x.buyers);
    const buyers = (names || []).join(" · ");
    return `<li class="aucrow">
      <div class="auc1"><span>${esc(x.competition)}</span>${rank ? `<span class="auc-rank">${esc(rank)}${score ? " · " + esc(score) : ""}</span>` : (score ? `<span class="auc-rank">${esc(score)}</span>` : "")}</div>
      ${meta ? `<div class="auc2">${esc(meta)}</div>` : ""}
      ${buyers ? `<div class="auc3"><span class="k">낙찰 로스터리</span> ${esc(buyers)}${x.joint ? ` <span class="joint">공동</span>` : ""}</div>` : ""}
      ${x.src ? `<a class="auc-src" href="${esc(x.src)}" target="_blank" rel="noopener">경매 결과표</a>` : ""}
    </li>`;
  }).join("");
  return `<div class="auctions">
    <h3>🏆 옥션 낙찰</h3>
    <ul>${items}</ul>
  </div>`;
}

/* 카드 상단 사진 (photos.js가 그립니다: 출처·라이선스 링크 + '사진 저장' 버튼) */
function photoBlock(p, cls) {
  if (!p || !p.photo || !window.CI_PHOTO) return "";
  const label = p.kind === "country" ? p.name : p.country + " " + p.name;
  return window.CI_PHOTO.block(p.photo, label, cls ? { cls } : null);
}

function cardForPlace(p0) {

  const beans = beansByPlace.get(p.id) || [];
  const notes = countNotes(beans);
  const proc = countField(beans, "process");
  const vars = countField(beans, "variety");
  return `
  <div class="card">
    ${photoBlock(p)}
    <div class="eyebrow">${p.kind === "farm" ? "FARM" : p.kind === "country" ? "COUNTRY" : "ORIGIN"} ${precisionBadge(p)} ${auctionBadge(p)}</div>
    <h2 class="c-name">${esc(p.country)} · ${esc(p.name)}</h2>
    <p class="c-en">${esc(p.nameEn || "")}</p>
    <div class="c-region"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/></svg>
      ${p.lat.toFixed(2)}°, ${p.lon.toFixed(2)}° · 이곳에서 온 생두 <b>${beans.length.toLocaleString()}</b>종</div>
    <dl class="stats">
      <div class="stat"><dt>국가</dt><dd>${esc(p.country)}</dd></div>
      <div class="stat"><dt>지역</dt><dd>${esc(p.kind === "country" ? "—" : p.name)}</dd></div>
      <div class="stat wide"><dt>주요 가공</dt><dd>${proc.slice(0, 4).map(([k, v]) => `${esc(k)} <small style="color:#9A8F80">${v}</small>`).join(" · ") || "—"}</dd></div>
    </dl>
    ${notes.length ? `<div class="notes">${notes.slice(0, 10).map(([n, c]) => `<span class="note">${esc(n)}${c > 1 ? ` <small style="opacity:.6">${c}</small>` : ""}</span>`).join("")}</div>` : ""}
    ${vars.length ? `<p class="story">품종: ${vars.slice(0, 6).map(([k, v]) => `${esc(k)} <small style="color:#9A8F80">${v}</small>`).join(" · ")}</p>` : ""}
    ${terroirBlock(p)}
    ${storyBlock(p)}
    ${auctionsBlock(p)}
    ${awardsBlock(p)}

/* ---------- 국가 단위 카드: 농장·산지 상세 위치를 OSM에서 바로 찾기 ---------- */
function refineBlock(b) {
  return `<div class="refine">
    <p>국가 대표 좌표만 있습니다. 농장·산지 이름으로 OpenStreetMap을 한 번 더 찾아 생는 위치를 볼 수 있습니다.</p>
    <button type="button" class="rbtn" data-lookup="${esc(b.id)}">농장 상세 위치 찾기</button>
    <div class="out"></div>
  </div>`;
}

const refineLayer = L.layerGroup().addTo(map);

function latinWords(s) {
  return String(s || "")
    .replace(/[^A-Za-z0-9'\- ]/g, " ")
    .replace(/\b(finca|hacienda|estate|farm|lot|micro|natural|washed|honey|anaerobic)\b/gi, " ")
    .replace(/\b[0-9]{2,}\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function showRefineHit(lat, lon, name) {
  refineLayer.clearLayers();
  L.circleMarker([lat, lon], { radius: 9, color: "#C2603C", weight: 2, dashArray: "3 3", fillColor: "#C2603C", fillOpacity: .18 })
    .addTo(refineLayer)
    .bindTooltip(`<b>${esc(name)}</b><span>실시간 조회 참고 위치</span>`, { direction: "top", offset: [0, -6], className: "lt-tip", permanent: false });
  map.flyTo([lat, lon], 12, { duration: 1.1 });
}

async function lookupFarm(btn) {
  const b = CAT.beans.find((x) => x.id === btn.dataset.lookup);
  if (!b) return;
  const p = placeById.get(b.placeId) || {};
  const out = btn.parentElement.querySelector(".out");
  const name = latinWords(b.farm) ? b.farm : latinWords(b.name);
  const words = latinWords(name);
  const countryEn = p.nameEn || "";
  if (words.replace(/\s/g, "").length < 3) {
    out.innerHTML = `<p class="qr-note">농장 이름의 영문 표기가 없어 자동 조회를 할 수 없습니다. ${countryEn ? `<a href="https://www.openstreetmap.org/search?query=${encodeURIComponent(countryEn)}" target="_blank" rel="noopener">OpenStreetMap에서 직접 찾기</a>` : ""}</p>`;
    return;
  }
  const query = `${words}, ${countryEn}`.replace(/^,\s*/, "");
  btn.disabled = true;
  out.innerHTML = `<p class="qr-note"><span class="spin"></span>OpenStreetMap에서 “${esc(query)}” 찾는 중…</p>`;
  try {
    const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams({ format: "jsonv2", limit: "3", q: query, "accept-language": "ko,en" });
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = await res.json();
    if (!list.length) {
      out.innerHTML = `<p class="qr-note">“${esc(query)}”로 찾은 곳이 없습니다. <a href="https://www.openstreetmap.org/search?query=${encodeURIComponent(query)}" target="_blank" rel="noopener">OpenStreetMap에서 직접 확인</a></p>`;
      return;
    }
    out.innerHTML = `<p class="qr-note">OpenStreetMap 실시간 조회 결과입니다. 카탈로그 좌표가 아니라 참고용입니다.</p>` +
      list.map((h) => `<button type="button" class="hit" data-hit="${esc(String(h.lat))},${esc(String(h.lon))}" data-hitname="${esc(h.name || h.display_name)}">
        <span><span class="hn">${esc(h.name || h.display_name)}</span><span class="hd">${esc(String(h.display_name).slice(0, 90))}</span></span>
        <span class="go">지도로</span></button>`).join("");
    out.querySelectorAll("[data-hit]").forEach((el) => el.addEventListener("click", () => {
      const [la, lo] = el.dataset.hit.split(",").map(Number);
      showRefineHit(la, lo, el.dataset.hitname);
    }));
  } catch (e) {
    out.innerHTML = `<p class="qr-note">실시간 조회가 지금은 되지 않습니다(${esc(e.message)}). 잠시 뒤 다시 시도해 주세요.</p>`;
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 로스터 한줄 후기 (공용 DB: 구글 폼 접수 → 공개 구글 시트 읽기) ----------
   · 제출: 구글 폼 formResponse POST — 로그인·계정 필요 없음, 이메일 수집 없음
   · 읽기: 폼 응답을 옮겨 담는 공개 구글 시트(reviews 탭)를 gviz JSON으로 읽는다
   · 방금 쓴 후기는 시트에 올라오기 전까지 이 기기에 남겨 두고 함께 보여 준다
     loadReviews(placeId) -> Promise<[{name, roast, text, at}]>
     saveReview(placeId, review) -> Promise<review[]>                            */
const REVIEW_KEY = "krumble.roastReviews.v2";
const ROASTS = ["라이트", "미디엄라이트", "미디엄", "다크"];
const REVIEW_DB = {
  sheetId: "1qIGVwlhB5O22dMrFrfffW2Xm8vsNHObUDsI8euzKi4U",
  tab: "reviews",
  formResponse: "https://docs.google.com/forms/d/e/1FAIpQLScQDYQf7xIg0uvkUG67gYuzE0SVlt64a-CZ0NczYSk3RdfnFw/formResponse",
  formView: "https://docs.google.com/forms/d/e/1FAIpQLScQDYQf7xIg0uvkUG67gYuzE0SVlt64a-CZ0NczYSk3RdfnFw/viewform",
  entry: {
    place: "entry.102505071",
    name: "entry.1990802694",
    roast: "entry.877419205",
    text: "entry.1310252727"
  }
};
const REVIEW_TTL = 30 * 24 * 60 * 60 * 1000;   // 임시 보관 기간
let lastSubmitFailed = false;

function readPendingReviews() {
  try {
    if (typeof localStorage === "undefined") return [];
    const list = JSON.parse(localStorage.getItem(REVIEW_KEY) || "[]");
    if (!Array.isArray(list)) return [];
    return list.filter((x) => x && x.place && x.text && Date.now() - (x.at || 0) < REVIEW_TTL);
  } catch (e) { return []; }
}
function writePendingReviews(list) {
  try {
    if (typeof localStorage !== "undefined") localStorage.setItem(REVIEW_KEY, JSON.stringify(list.slice(-50)));
  } catch (e) { /* 저장 공간이 없는 브라우저는 조용히 넘어감 */ }
}

const reviewSheet = { rows: null, at: 0, pending: null, failed: false };

function fetchSheetReviews(force) {
  if (!force && reviewSheet.rows && Date.now() - reviewSheet.at < 30000) return Promise.resolve(reviewSheet.rows);
  if (reviewSheet.pending) return reviewSheet.pending;
  const url = "https://docs.google.com/spreadsheets/d/" + REVIEW_DB.sheetId + "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(REVIEW_DB.tab);
  reviewSheet.pending = (async () => {
    try {
      const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
      const res = await fetch(url, ctrl ? { signal: ctrl.signal, cache: "no-store" } : { cache: "no-store" });
      if (timer) clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const table = (JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1)) || {}).table || {};
      const rows = (table.rows || []).map((r) => {
        const c = (r.c || []).map((x) => (x && x.v != null ? String(x.v) : ""));
        return { at: c[0] || "", place: (c[1] || "").trim(), name: (c[2] || "").trim(), roast: (c[3] || "").trim(), text: (c[4] || "").trim() };
      }).filter((r) => r.place && r.text);
      reviewSheet.rows = rows;
      reviewSheet.at = Date.now();
      reviewSheet.failed = false;
      return rows;
    } catch (e) {
      reviewSheet.failed = true;
      return reviewSheet.rows || [];   // 못 불러오면 지난 목록 또는 빈 목록
    } finally {
      reviewSheet.pending = null;
    }
  })();
  return reviewSheet.pending;
}

function reviewTime(s) {
  if (!s) return 0;
  const t = Date.parse(String(s).replace(" ", "T"));
  return isNaN(t) ? 0 : t;
}
function reviewKey(r) {
  return String(r.name || "") + "|" + String(r.text || "").replace(/\s+/g, " ").trim();
}

async function loadReviews(placeId) {
  const rows = await fetchSheetReviews(false);
  const seen = new Set();
  const list = [];
  rows.forEach((r) => {
    if (r.place !== placeId) return;
    seen.add(reviewKey(r));
    list.push({ name: r.name || "익명 로스터", roast: r.roast, text: r.text, at: reviewTime(r.at) });
  });
  const keep = [];
  readPendingReviews().forEach((p) => {
    if (p.place !== placeId) { keep.push(p); return; }
    if (seen.has(reviewKey(p))) return;   // 시트에 올라왔으니 임시 사본은 지운다
    keep.push(p);
    list.push({ name: p.name || "익명 로스터", roast: p.roast, text: p.text, at: p.at || 0, pending: true });
  });
  writePendingReviews(keep);
  return list.sort((a, b) => a.at - b.at);
}

async function saveReview(placeId, review) {
  const item = {
    pid: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    place: placeId,
    name: review.name || "익명 로스터",
    roast: review.roast || "미디엄",
    text: review.text,
    at: review.at || Date.now()
  };
  const all = readPendingReviews();
  all.push(item);
  writePendingReviews(all);
  const body = new FormData();
  body.append(REVIEW_DB.entry.place, item.place);
  body.append(REVIEW_DB.entry.name, item.name);
  body.append(REVIEW_DB.entry.roast, item.roast);
  body.append(REVIEW_DB.entry.text, item.text);
  body.append("fvv", "1");
  body.append("pageHistory", "0");
  lastSubmitFailed = false;
  try {
    /* 구글 폼은 no-cors라 응답 본문을 읽을 수 없다. 요청이 나가면 접수로 본다. */
    await fetch(REVIEW_DB.formResponse, { method: "POST", mode: "no-cors", body });
  } catch (e) { lastSubmitFailed = true; }
  return loadReviews(placeId);
}

function reviewsBlock(placeId) {
  return `<div class="revbox" data-rev="${esc(placeId)}">
    <h3>로스터 한줄 후기</h3>
    <div class="revlist" data-revlist="1"><p class="empty-rev">불러오는 중…</p></div>
    <form class="revform" data-revform="1" autocomplete="off">
      <input name="name" type="text" maxlength="30" placeholder="로스터리 이름" aria-label="로스터리 이름" required />
      <select name="roast" aria-label="배전도">${ROASTS.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select>
      <input class="wide" name="text" type="text" maxlength="120" placeholder="로스팅·추출 한줄 후기" aria-label="한줄 후기" required />
      <button type="submit">후기 등록</button>
    </form>
    <p class="revnote" data-revmsg="1" role="status"></p>
    <p class="revnote">등록한 후기는 모든 방문자에게 공개됩니다 · 로스터리명·배전도·후기 내용이 공개 지도에 표시될 수 있으며, 로그인·이메일 수집은 없습니다.</p>
  </div>`;
}

function reviewItemHTML(r) {
  const when = r.at ? new Date(r.at) : null;
  const stamp = r.pending ? "방금 등록" : when && !isNaN(when) ? `${when.getFullYear()}.${String(when.getMonth() + 1).padStart(2, "0")}.${String(when.getDate()).padStart(2, "0")}` : "";
  return `<div class="revitem">
    <div class="rh"><span class="who">${esc(r.name || "로스터")}</span><span class="roast">${esc(r.roast || "-")}</span><span class="when">${stamp}</span></div>
    <p class="rt2">${esc(r.text || "")}</p>
  </div>`;
}

async function hydrateReviews(root) {
  const boxes = (root || sheetEl).querySelectorAll("[data-rev]");
  for (const box of boxes) {
    const id = box.dataset.rev;
    const list = box.querySelector("[data-revlist]");
    if (!list) continue;
    const items = await loadReviews(id);
    list.innerHTML = items.length
      ? items.slice(-20).reverse().map(reviewItemHTML).join("")
      : reviewSheet.failed
      ? `<p class="empty-rev">후기 목록을 지금 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</p>`
      : `<p class="empty-rev">아직 후기가 없습니다. 이 농장을 볶아 본 로스터의 첫 후기를 남겨 보세요.</p>`;
  }
}

function bindReviews(root) {
  (root || sheetEl).querySelectorAll("[data-revform]").forEach((form) => {
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const box = form.closest("[data-rev]");
      const id = box && box.dataset.rev;
      if (!id) return;
      const name = (form.elements.name.value || "").trim();

      const text = (form.elements.text.value || "").trim();
      if (text.length < 2) { form.elements.text.focus(); return; }
      const btn = form.querySelector("button");
      const msg = box.querySelector("[data-revmsg]");
      if (btn) btn.disabled = true;
      if (msg) msg.textContent = "등록 중…";
      await saveReview(id, { name: name || "익명 로스터", roast, text, at: Date.now() });
      form.reset();
      if (btn) btn.disabled = false;
      if (msg) msg.textContent = lastSubmitFailed
        ? "전송에 실패했습니다. 잠시 뒤 다시 눌러 주세요. (적은 내용은 이 기기에 남아 있습니다)"
        : "등록했습니다. 다른 로스터에게도 곧 보입니다.";
      await hydrateReviews(box.parentElement || sheetEl);
    });
  });
}

function countNotes(beans) {  const m = new Map();
  for (const b of beans) for (const n of b.cupNotes || []) m.set(n, (m.get(n) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function countField(beans, f) {
  const m = new Map();
  for (const b of beans) { const v = b[f]; if (v) m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

/* ---------- 선택 ---------- */
/* 줌 단계: 농장 12 · 마을 11 · 산지 9 · 국가 5 */
const ZOOM = { farm: 12, village: 11, region: 9, country: 5 };
function zoomFor(p) {
  if (!p) return 5;
  return ZOOM[p.precision] != null ? ZOOM[p.precision] : (p.kind === "country" ? 5 : 9);
}

function selectPlace(p) {
  state.place = p; state.bean = null; state.results = null;
  map.flyTo([p.lat, p.lon], zoomFor(p), { duration: 1.1 });
  drawPins(); renderSheet(); syncUrl();
}
function selectBean(b) {
  state.bean = b; state.results = null;
  const p = placeById.get(b.placeId);
  state.place = p || null;
  if (p) map.flyTo([p.lat, p.lon], zoomFor(p), { duration: 1.1 });
  drawPins(); renderSheet(); syncUrl();
}

/* ---------- 검색 ---------- */
const PLACE_RANK = { farm: 0, village: 1, region: 2, country: 3 };
function searchPlaces(q) {
  const toks = String(q).trim().split(/\s+/).filter(Boolean).map(norm).filter(Boolean);
  if (!toks.length || !CAT.places.length) return [];
  const out = [];
  for (const p of CAT.places) {
    const t = norm([p.name, p.nameEn, p.nameJa, p.country, (p.alias || []).join(" ")].filter(Boolean).join(" "));
    let ok = true;
    for (const k of toks) if (!t.includes(k)) { ok = false; break; }
    if (ok) out.push(p);
  }
  out.sort((a, b) => (PLACE_RANK[a.precision] ?? 4) - (PLACE_RANK[b.precision] ?? 4) || (b.beanCount || 0) - (a.beanCount || 0));
  return out;
}
function hay(b) {
  /* 표시 이름이 바뀐 산지(예: 윈난 → 운남)는 옛 이름으로도 찾히도록 별칭을 함께 넣습니다 */
  const pa = (placeById.get(b.placeId) || {}).alias || [];
  return norm([b.name, b.nameEn, b.nameJa, b.region, b.farm, b.country, b.variety, b.process,
               (b.cupNotes || []).join(" "), pa.join(" ")].join(" "));
}
let INDEX = [];
function buildIndex() {
  INDEX = CAT.beans.map((b) => ({ b, h: hay(b) }));
}
function searchBeans(q) {
  const toks = String(q).trim().split(/\s+/).filter(Boolean).map(norm).filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  for (const { b, h } of INDEX) {
    let ok = true;
    for (const t of toks) if (!h.includes(t)) { ok = false; break; }
    if (ok) out.push(b);
  }
  out.sort((a, b) => (b.listingCount || 1) - (a.listingCount || 1));
  return out;
}
function suggest(q) {
  const places = searchPlaces(q).slice(0, 3);
  const r = searchBeans(q).slice(0, places.length ? 4 : 8);
  if (!r.length && !places.length) { sugEl.innerHTML = `<div class="live">${esc(q)} — 카탈로그에서 찾지 못했습니다. 산지 이름이나 국가로 검색해 보세요.</div>`; return; }
  sugEl.innerHTML = places.map((p) => `<button type="button" data-sp="${esc(p.id)}" class="p">
    <span class="dot" style="background:${p.kind === "farm" ? "#9A5B2E" : "#2F4636"}"></span>
    <span><span class="nm">${esc(p.country)} · ${esc(p.name)}</span><span class="mt">${p.kind === "farm" ? "농장" : p.kind === "country" ? "국가" : "산지"} · ${(p.beanCount || 0) ? (p.beanCount).toLocaleString() + "종" : "카탈로그 미수록"}</span></span>
  </button>`).join("") + r.map((b) => `<button type="button" data-sb="${esc(b.id)}">
    <span class="dot" style="background:#2F4636"></span>
    <span><span class="nm">${esc(beanName(b))}</span><span class="mt">${esc([b.country, b.region, b.process].filter(Boolean).join(" · "))}</span></span>
  </button>`).join("");
  sugEl.querySelectorAll("[data-sb]").forEach((el) => el.addEventListener("click", () => {
    const b = CAT.beans.find((x) => x.id === el.dataset.sb);
    sugEl.classList.remove("on");
    qEl.value = beanName(b);
    selectBean(b);
  }));
  sugEl.querySelectorAll("[data-sp]").forEach((el) => el.addEventListener("click", () => {
    const p = placeById.get(el.dataset.sp);
    sugEl.classList.remove("on");
    if (p) selectPlace(p);
  }));
}

/* ---------- URL ---------- */
function syncUrl() {
  const p = new URLSearchParams();
  if (state.bean) p.set("bean", state.bean.id);
  else if (state.place) p.set("place", state.place.id);
  else if (state.query) p.set("q", state.query);
  if (state.procDetail) p.set("process", state.procDetail);
  else if (state.proc && state.proc !== "all") p.set("process", state.proc);
  const s = p.toString();
  history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
}

/* 인쇄물에 남은 예전 딥링크 값을 카탈로그 검색어로 옮깁니다 */
const LEGACY_QR = {
  "el-diamante": "엘 디아만테",
  "santa-felisa-2722": "산타펠리사",
  "peru-cusco-flores": "쿠스코"
};

async function boot() {
  renderChips();
  renderSheet();
  drawPins();
  const params = new URLSearchParams(location.search);
  try {
    await loadCatalog();
    buildIndex();
    const c = CAT.meta.counts;
    setLede(c);
  } catch (e) {
    sheetEl.innerHTML = `<div class="empty"><h3>카탈로그를 불러오지 못했습니다</h3>
      <p>beans.json을 같은 폴더에 두고 웹 서버로 열어 주세요.<br><small>${esc(e.message)}</small></p></div>`;
    return;
  }
  renderChips();
  applyProcParam(params.get("process"));
  drawPins();
  const beanId = params.get("bean"), placeId = params.get("place"), q = params.get("q"), coffee = params.get("coffee");
  if (beanId) { const b = CAT.beans.find((x) => x.id === beanId); if (b) return selectBean(b); }
  if (placeId) { const p = placeById.get(placeId); if (p) return selectPlace(p); }
  /* 예전에 인쇄해 둔 ?coffee= QR이 남아 있어도 카탈로그 검색으로 이어지게 */
  const query = q || LEGACY_QR[coffee] || "";
  if (query) { qEl.value = query; state.query = query; state.results = searchBeans(query); renderSheet(); syncUrl(); }
  else renderSheet();
}

function psSetStatus(mode, label, pct, note) {
  PV.mode = mode; PV.label = label; PV.pct = pct; PV.note = note || "";
  const box = document.getElementById("psState");
  if (!box) { psRender(); return; }
  box.classList.toggle("ok", mode === "ok");
  box.classList.toggle("fail", mode === "fail");
  const spin = document.getElementById("psSpin");
  if (spin) spin.style.display = mode === "run" ? "" : "none";
  const lbl = document.getElementById("psLabel");
  if (lbl) lbl.textContent = label;
  const pctEl = document.getElementById("psPct");
  if (pctEl) pctEl.textContent = typeof pct === "number" && pct > 0 ? Math.round(pct * 100) + "%" : "";
  const fill = document.getElementById("psFill");
  if (fill) fill.style.width = (typeof pct === "number" ? Math.round(pct * 100) : 0) + "%";
  const noteEl = document.getElementById("psNote");
