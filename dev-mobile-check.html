<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mobile check</title>
<style>
  html,body{margin:0;background:#ddd;font-family:sans-serif}
  .bar{padding:6px 10px;font-size:12px;background:#222;color:#fff}
  iframe{width:390px;height:844px;border:0;display:block;margin:8px auto;background:#fff}
</style>
</head>
<body>
<div class="bar" id="bar">mobile check</div>
<div id="host"></div>
<script>
  const p = new URLSearchParams(location.search).get("p") || "guide.html";
  document.getElementById("bar").textContent = "390×844 · " + p;
  const f = document.createElement("iframe");
  f.src = p;
  f.title = p;
  f.addEventListener("load", () => {
    try {
      f.contentDocument.querySelectorAll('link[rel="stylesheet"]').forEach((l) => {
        if (l.href.includes("cdn.jsdelivr")) return;
        l.href = l.getAttribute("href").split("?")[0] + "?t=" + Date.now();
      });
    } catch (e) {}
  });
  document.getElementById("host").appendChild(f);
</script>
</body>
</html>
