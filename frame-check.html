<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex,nofollow" />
<title>화면 확인용 (임시)</title>
<style>
  body{margin:0;padding:12px;background:#625D56;font-family:system-ui,sans-serif}
  h1{font-size:14px;color:#fff;margin:0 0 8px}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .col{background:#fff;border-radius:8px;overflow:hidden}
  .col p{margin:0;padding:4px 8px;font-size:11px;background:#eee;color:#333}
  iframe{border:0;display:block;width:390px;height:2600px}
  #f673 iframe{width:673px;height:2200px}
</style>
</head>
<body>
<h1>순위판 화면 확인용 임시 페이지 (noindex)</h1>
<div class="row">
  <div class="col"><p>390 × 2600</p><iframe id="f390" src="/log.html" title="390px"></iframe></div>
  <div class="col" id="f673"><p>673 × 2200 (폴드 펼침)</p><iframe src="/log.html" title="673px"></iframe></div>
</div>
</body>
</html>
