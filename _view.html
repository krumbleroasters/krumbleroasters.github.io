<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레이아웃 확인용 (임시)</title>
<style>
  html,body{margin:0;background:#5A5148;color:#FBF7F0;font:12px/1.45 Pretendard,sans-serif}
  .row{display:flex;gap:18px;padding:14px;align-items:flex-start}
  .cap{padding:5px 8px;font-weight:800;letter-spacing:.04em;color:#FBF7F0}
  iframe{border:0;display:block;background:#FBF7F0}
  .dev{background:#2A251F;border-radius:6px;overflow:hidden}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search);
  var w = Number(q.get("w") || 390), h = Number(q.get("h") || 760);
  var src = q.get("src") || "/";
  document.getElementById("row").innerHTML =
    '<div class="dev"><div class="cap">' + w + ' &times; ' + h + '</div>' +
    '<iframe src="' + src + '" width="' + w + '" height="' + h + '" title="layout ' + w + '"></iframe></div>';
</script>
</body>
</html>
